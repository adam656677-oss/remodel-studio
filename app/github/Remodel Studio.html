/* ---- point clouds (PLY from COLMAP, Polycam, etc.) ---- */
function parsePLY(buf){
  const bytes=new Uint8Array(buf);let hdrEnd=-1;const dec=new TextDecoder();
  for(let i=0;i<Math.min(bytes.length,65536)-10;i++){if(bytes[i]===101&&dec.decode(bytes.subarray(i,i+10))==='end_header'){hdrEnd=i+10;while(bytes[hdrEnd]===13||bytes[hdrEnd]===10){hdrEnd++;if(bytes[hdrEnd-1]===10)break;}break;}}
  if(hdrEnd<0)throw new Error('This file is not a PLY point cloud.');
  const hdr=dec.decode(bytes.subarray(0,hdrEnd)).split(/\r?\n/);const fmt=(hdr.find(l=>l.startsWith('format'))||'').split(' ')[1];
  let count=0,props=[],inVertex=false;
  for(const l of hdr){const t=l.trim().split(/\s+/);if(t[0]==='element'){inVertex=t[1]==='vertex';if(inVertex)count=+t[2];}else if(t[0]==='property'&&inVertex&&t[1]!=='list')props.push({type:t[1],name:t[2]});}
  const size={char:1,uchar:1,int8:1,uint8:1,short:2,ushort:2,int16:2,uint16:2,int:4,uint:4,int32:4,uint32:4,float:4,float32:4,double:8,float64:8};
  const idx=n=>props.findIndex(p=>p.name===n);const ix=idx('x'),iy=idx('y'),iz=idx('z'),ir=idx('red'),ig=idx('green'),ib=idx('blue');
  if(ix<0||iy<0||iz<0)throw new Error('The PLY file has no x, y, z points.');
  const step=Math.max(1,Math.ceil(count/150000));const n=Math.ceil(count/step);const P=new Float32Array(n*3),C=new Uint8Array(n*3);let k=0;
  if(fmt==='ascii'){const lines=dec.decode(bytes.subarray(hdrEnd)).split(/\r?\n/);for(let i=0;i<count&&i<lines.length;i+=step){const v=lines[i].trim().split(/\s+/).map(Number);P[k*3]=v[ix];P[k*3+1]=v[iy];P[k*3+2]=v[iz];if(ir>=0){C[k*3]=v[ir];C[k*3+1]=v[ig];C[k*3+2]=v[ib];}k++;}}
  else{const le=fmt!=='binary_big_endian';const dv=new DataView(buf);const offs=[];let stride=0;for(const p of props){offs.push(stride);stride+=size[p.type]||4;}
    const rd=(o,t)=>t==='float'||t==='float32'?dv.getFloat32(o,le):t==='double'||t==='float64'?dv.getFloat64(o,le):t==='uchar'||t==='uint8'?dv.getUint8(o):t==='char'||t==='int8'?dv.getInt8(o):t==='short'||t==='int16'?dv.getInt16(o,le):t==='ushort'||t==='uint16'?dv.getUint16(o,le):t==='uint'||t==='uint32'?dv.getUint32(o,le):dv.getInt32(o,le);
    for(let i=0;i<count;i+=step){const b=hdrEnd+i*stride;if(b+stride>buf.byteLength)break;P[k*3]=rd(b+offs[ix],props[ix].type);P[k*3+1]=rd(b+offs[iy],props[iy].type);P[k*3+2]=rd(b+offs[iz],props[iz].type);
      if(ir>=0){C[k*3]=rd(b+offs[ir],props[ir].type);C[k*3+1]=rd(b+offs[ig],props[ig].type);C[k*3+2]=rd(b+offs[ib],props[ib].type);}k++;}}
  return {points:P.slice(0,k*3),colors:ir>=0?C.slice(0,k*3):null,count:k,total:count};
}
// cloud → plan inches using the project's cloud transform (scale to inches, up axis, rotation, offset)
function cloudToPlan(cl,t){const n=cl.points.length/3;const out=new Float32Array(n*3);const s=t.scale||39.37;const a=(t.rot||0)*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);
  for(let i=0;i<n;i++){let x=cl.points[i*3],y=cl.points[i*3+1],z=cl.points[i*3+2];let px,py,h;
    if(t.up==='z'){px=x;py=-y;h=z;}else if(t.up==='-y'){px=x;py=z;h=-y;}else{px=x;py=z;h=y;}
    px*=s;py*=s;h*=s;out[i*3]=px*ca-py*sa+(t.dx||0);out[i*3+1]=px*sa+py*ca+(t.dy||0);out[i*3+2]=h+(t.dz||0);}
  return out;}
// top-down picture of the points between two heights, for tracing walls
function cloudSliceImage(planPts,zLo,zHi){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const n=planPts.length/3;for(let i=0;i<n;i++){const z=planPts[i*3+2];if(z<zLo||z>zHi)continue;const x=planPts[i*3],y=planPts[i*3+1];x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}
  if(x0>x1)return null;const W=1024,k=W/Math.max(1,Math.max(x1-x0,y1-y0));const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil((x1-x0)*k));c.height=Math.max(1,Math.ceil((y1-y0)*k));
  const g=c.getContext('2d');g.fillStyle='rgba(200,60,40,0.55)';for(let i=0;i<n;i++){const z=planPts[i*3+2];if(z<zLo||z>zHi)continue;g.fillRect((planPts[i*3]-x0)*k,(planPts[i*3+1]-y0)*k,1.6,1.6);}
  return {url:c.toDataURL('image/png'),x:x0,y:y0,w:x1-x0,h:y1-y0};
}

/* ---- the Capture screen ---- */
const ROOM_PROMPT=`You are helping someone measure a room so it can be drawn to scale for a remodel plan. The photos show one room from the inside.
Name the walls by where they are from the first photo's camera position: "back" = the wall the camera faces, "left", "right", and "behind" = the wall behind the camera (only if another photo shows it).
List every door and window on those walls, in left-to-right order as you face each wall from inside the room.
Reply with only JSON in this shape:
{"roomName": string, "use": one of "living","bedroom","kitchen","dining","bath","hall","laundry","closet","garage","other",
 "summary": one short sentence,
 "walls": [{"side": "back"|"left"|"right"|"behind", "exterior": true if it looks like an outside wall (windows to the outdoors)}],
 "openings": [{"side": "back"|"left"|"right"|"behind", "type": "door"|"window", "label": short description, "operation": for windows one of "double-hung","casement","slider","fixed","awning"}],
 "notes": [things worth measuring or checking, such as a beam, soffit, sloped ceiling, step or damage; at most 5]}`;
const FACADE_PROMPT=`You are helping someone measure the outside of a house so it can be drawn to scale for a remodel plan. The photos show one side of the house from outside.
List every door and window on that side in left-to-right order as you face the wall.
Reply with only JSON in this shape:
{"summary": one short sentence, "openings": [{"type": "door"|"window", "label": short description, "operation": for windows one of "double-hung","casement","slider","fixed","awning"}],
 "notes": [things worth measuring or checking, such as roof overhang, porch, steps, siding type, damage; at most 5]}`;
function questionsFor(kind,a){

  (a.openings||[]).forEach((o,i)=>{const nm=`${o.type==='door'?'Door':'Window'} ${i+1}${o.side?` (${o.side} wall)`:''}: ${o.label||''}`;
    q.push({id:`o${i}.offset`,label:`${nm}: left corner to the edge of the opening`,bare:'in',group:nm});
    q.push({id:`o${i}.width`,label:`${nm}: width`,bare:'in',group:nm});q.push({id:`o${i}.height`,label:`${nm}: height`,bare:'in',group:nm});

function PhotoAssistant({p,commit,sel,levelId,assets,setMode,setSel}){

    catch(e){console.warn('photo analysis failed',e);const c=e&&e.code;setMsg({ok:false,t:c==='not_granted'?'Claude was not allowed to look at the photos. Use “Room from measurements” instead.':c==='rate_limited'?'Too many requests right now. Try again in a minute.':c==='cancelled'?'Stopped.':c==='image_rejected'?'One of the photos could not be read. Try a JPEG or PNG.':'The photos could not be analyzed. Try clearer photos, or use “Room from measurements”.'});}

    else{if(!wall){setMsg({ok:false,t:'Select the outside wall in the plan first, then come back.'});return;}
      commit(applyFacade(p,wall,{wallLength:vals.wallLength,openings:ops,status:'existing'}));setMsg({ok:true,t:`${ops.length} opening${ops.length===1?'':'s'} added to the selected wall.`});}
  };

    <div className="row"><div className="seg">${[['room','A room, from inside'],['facade','A side of the house, from outside']].map(([k,l])=>html`<button key=${k} className=${kind===k?'on':''} onClick=${()=>{setKind(k);setAns(null);}}>${l}</button>`)}</div></div>
    ${kind==='facade'?html`<p className="note">${wall?html`Openings will be added to the selected wall (${fmtLen(wlen(wall))}).`:'Select the outside wall in the plan first; openings are added to it.'}</p>`:null}
    <div className="row"><label className="btn" htmlFor="cap-files">Choose photos…</label><input id="cap-files" type="file" accept="image/*" multiple hidden onChange=${e=>{setFiles([...e.target.files].slice(0,4));setAns(null);}}/>
      <span className="note">${files.length?files.length+' photo'+(files.length>1?'s':'')+' chosen':'No photos yet'}</span>
      <button className="btn primary" disabled=${!sampleFn||!files.length||busy} onClick=${analyze}>${busy?'Looking at the photos…':'Analyze photos'}</button>${busy?html`<button className="btn" onClick=${()=>ctl.current&&ctl.current.abort()}>Stop</button>`:null}</div>
    ${files.length?html`<div className="thumbs">${files.map((f,i)=>html`<img key=${i} src=${blobURL('f'+i+f.name+f.size,f)} alt=${'Photo '+(i+1)}/>`)}</div>`:null}
    ${ans?html`<div className="capresult"><h3>${ans.roomName||'What the photos show'}</h3><p>${ans.summary||''}</p>
      ${(ans.notes||[]).length?html`<ul className="note">${ans.notes.map((n,i)=>html`<li key=${i}>${n}</li>`)}</ul>`:null}
      <h3>Measurements needed</h3><p className="note">Measure with a tape for 1-inch accuracy. Values from the iPhone Measure app can be pasted in. Offsets and sills left blank are treated as 0 and 36".</p>
      <${MeasureForm} questions=${qs} values=${vals} setValues=${setVals}/>

}

const CAPTURE_PY=`"""Remodel Studio capture helper: run COLMAP on a folder of photos and write cloud.ply.
Usage: python capture.py IMAGES_FOLDER [--colmap PATH_TO_COLMAP] [--quick]
"""
import argparse, os, shutil, subprocess, sys

ap = argparse.ArgumentParser()
ap.add_argument("images")
ap.add_argument("--colmap", default=shutil.which("colmap") or shutil.which("COLMAP.bat") or "colmap")

a = ap.parse_args()

images = os.path.abspath(a.images)
if not os.path.isdir(images):
    sys.exit("Folder not found: " + images)
work = os.path.dirname(images.rstrip("\\\\/"))

sparse = os.path.join(work, "sparse")
dense = os.path.join(work, "dense")
os.makedirs(sparse, exist_ok=True)

def run(*args):
    print(">", " ".join(args), flush=True)

    run("stereo_fusion", "--workspace_path", dense, "--output_path", out)
print("Done:", out)
print("Import it in Remodel Studio: Capture > Underlay and scans > Import .ply scan")
`;

// A photo is set to scale one of two ways:
//   line: two points on something of known length (good when the surface faces the camera squarely)
//   rectangle: four corners of a known rectangle such as a door; a homography removes perspective,
//   so measurements anywhere on that same flat surface stay accurate even when the photo is taken at an angle.
function homography(src,dst){ // src/dst: 4 [x,y] pairs; returns 3x3 as array of 9 (h33=1)
  const A=[],b=[];for(let i=0;i<4;i++){const [x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}
  const n=8;for(let c=0;c<n;c++){let piv=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[piv][c]))piv=r;[A[c],A[piv]]=[A[piv],A[c]];[b[c],b[piv]]=[b[piv],b[c]];

const hApply=(H,[x,y])=>{const w=H[6]*x+H[7]*y+H[8];return [(H[0]*x+H[1]*y+H[2])/w,(H[3]*x+H[4]*y+H[5])/w];};

const FONT='Helvetica, Arial, sans-serif';
const tw=(s,size,bold)=>String(s).length*size/72*(bold?0.6:0.54);

function DL(){const a=[];return {items:a,
  line(x1,y1,x2,y2,w=0.5,o={}){a.push({t:'line',x1,y1,x2,y2,w,...o});},
  poly(pts,o={}){a.push({t:'poly',pts,...o});},
  text(x,y,s,o={}){a.push({t:'text',x,y,s:String(s),size:o.size||8,anchor:o.anchor||'start',rot:o.rot||0,bold:!!o.bold,color:o.color||INK});},
  circle(cx,cy,r,o={}){a.push({t:'circle',cx,cy,r,...o});},
};}
const arcPts=(cx,cy,r,a0,a1,n=14)=>{const out=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;out.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return out;};
function wrapText(s,maxW,size,bold){const words=String(s).split(/\s+/).filter(Boolean);const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(tw(t,size,bold)>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}

/* ---- opening marks shared by plans and schedules ---- */
function openingMarks(p){
  const order=sortedLevels(p).map(l=>l.id); const rows=[];

function sheetFrame(dl,P,p,no,title,scaleLabel){

  dl.poly([[m,m],[W-m,m],[W-m,H-m],[m,H-m]],{stroke:INK,w:1.6});
  dl.line(x0,m,x0,H-m,1.2);

  for(const l of wrapText((p.name||'Untitled house').toUpperCase(),tw_,10*k,true).slice(0,3)){dl.text(tx,y,l,{size:10*k,bold:true});y+=0.2*k;}
  y+=0.04*k;
  const kv=(lab,val)=>{if(!val)return;dl.text(tx,y,lab,{size:5*k,bold:true,color:MID});y+=0.13*k;for(const l of wrapText(val,tw_,6.5*k).slice(0,3)){dl.text(tx,y,l,{size:6.5*k});y+=0.13*k;}y+=0.06*k;};
  kv('DESIGN OPTION',activeOptionName(p));kv('ADDRESS',info.address);kv('PREPARED FOR',info.client);kv('DRAWN BY',info.designer);
  kv('DATE',info.date||new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}));kv('REVISION',info.revision);
  y+=0.04*k;dl.line(x0,y,W-m,y,0.6);y+=0.2*k;

  // bottom block
  const by=H-m-1.05*k; dl.line(x0,by,W-m,by,1.2);

function drawTable(dl,x,y,cols,rows,k,maxY){
  const rh=0.17*k,hs=5.2*k,bs=6*k; const W=cols.reduce((s,c)=>s+c.w,0);
  dl.poly([[x,y],[x+W,y],[x+W,y+rh],[x,y+rh]],{fill:'#e6e6e6',stroke:INK,w:0.6});
  let cx=x;for(const c of cols){dl.text(cx+0.05*k,y+rh-0.055*k,c.h,{size:hs,bold:true});cx+=c.w;}
  let yy=y+rh,shown=0;
  for(const r of rows){if(maxY&&yy+rh>maxY)break;cx=x;r.forEach((v,i)=>{dl.text(cx+0.05*k,yy+rh-0.05*k,v,{size:bs});cx+=cols[i].w;});dl.line(x,yy+rh,x+W,yy+rh,0.3,{color:MID});yy+=rh;shown++;}
  dl.line(x,y,x,yy,0.6);dl.line(x+W,y,x+W,yy,0.6);dl.line(x,yy,x+W,yy,0.6);
  cx=x;for(const c of cols.slice(0,-1)){cx+=c.w;dl.line(cx,y,cx,yy,0.3,{color:MID});}
  if(shown<rows.length)dl.text(x,yy+0.14*k,`+ ${rows.length-shown} more not shown at this paper size`,{size:5*k,color:MID});
  return yy-y+(shown<rows.length?0.2*k:0);
}

function pickScale(fitW,fitH,needW,needH,choice,list=SCALES){
  if(choice&&choice!=='auto'){const s=list.find(s=>String(s[0])===String(choice));if(s){const sc=s[0]/12;if(list===SCALES||(needW(sc)<=fitW&&needH(sc)<=fitH))return s;}}
  for(const s of list){const sc=s[0]/12;if(needW(sc)<=fitW&&needH(sc)<=fitH)return s;}
  return list[list.length-1];
}
/* ---- renderers ---- */
function sheetItemEl(it,i){
  const sw=w=>(w||0.5)/72;
  if(it.t==='line')return html`<line key=${i} x1=${it.x1} y1=${it.y1} x2=${it.x2} y2=${it.y2} stroke=${it.color||INK} strokeWidth=${sw(it.w)} strokeDasharray=${it.dash?it.dash.join(' '):undefined}/>`;
  if(it.t==='poly'){const ring=r=>'M'+r.map(q=>q[0].toFixed(4)+' '+q[1].toFixed(4)).join('L')+(it.close===false?'':'Z');
    return html`<path key=${i} d=${[it.pts,...(it.holes||[])].map(ring).join('')} fillRule="evenodd" fill=${it.fill||'none'} stroke=${it.stroke||'none'} strokeWidth=${sw(it.w)} strokeDasharray=${it.dash?it.dash.join(' '):undefined} strokeLinejoin="round"/>`;}
  if(it.t==='circle')return html`<circle key=${i} cx=${it.cx} cy=${it.cy} r=${it.r} fill=${it.fill||'none'} stroke=${it.stroke||'none'} strokeWidth=${sw(it.w)}/>`;
  if(it.t==='text')return html`<text key=${i} x=${it.x} y=${it.y} fontSize=${it.size/72} fontFamily=${FONT} fontWeight=${it.bold?700:400} textAnchor=${it.anchor} fill=${it.color} transform=${it.rot?`rotate(${it.rot} ${it.x} ${it.y})`:undefined}>${it.s}</text>`;
  return null;
}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function sheetToSVGString(s){
  const sw=w=>((w||0.5)/72).toFixed(4); const parts=[];
  for(const it of s.items){
    if(it.t==='line')parts.push(`<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" stroke="${it.color||INK}" stroke-width="${sw(it.w)}"${it.dash?` stroke-dasharray="${it.dash.join(' ')}"`:''}/>`);
    else if(it.t==='poly'){const ring=r=>'M'+r.map(q=>q[0].toFixed(4)+' '+q[1].toFixed(4)).join('L')+(it.close===false?'':'Z');
      parts.push(`<path d="${[it.pts,...(it.holes||[])].map(ring).join('')}" fill-rule="evenodd" fill="${it.fill||'none'}" stroke="${it.stroke||'none'}" stroke-width="${sw(it.w)}"${it.dash?` stroke-dasharray="${it.dash.join(' ')}"`:''} stroke-linejoin="round"/>`);}
    else if(it.t==='circle')parts.push(`<circle cx="${it.cx}" cy="${it.cy}" r="${it.r}" fill="${it.fill||'none'}" stroke="${it.stroke||'none'}" stroke-width="${sw(it.w)}"/>`);
    else if(it.t==='text')parts.push(`<text x="${it.x}" y="${it.y}" font-size="${(it.size/72).toFixed(4)}" font-family="${FONT}" font-weight="${it.bold?700:400}" text-anchor="${it.anchor}" fill="${it.color}"${it.rot?` transform="rotate(${it.rot} ${it.x} ${it.y})"`:''}>${esc(it.s)}</text>`);}
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${s.w}in" height="${s.h}in" viewBox="0 0 ${s.w} ${s.h}"><rect width="${s.w}" height="${s.h}" fill="#ffffff"/>${parts.join('')}</svg>`;

let jspdfLoading=null;
function loadJsPDF(){
  if(window.jspdf)return Promise.resolve();
  if(!jspdfLoading)jspdfLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=()=>res();s.onerror=()=>{jspdfLoading=null;rej(new Error('The PDF library did not load. Check your internet connection and try again.'));};document.head.appendChild(s);});
  return jspdfLoading;
}
async function sheetsToPDF(sheets,p){
  await loadJsPDF(); const {jsPDF}=window.jspdf; let doc=null;
  for(const s of sheets){const o=s.w>=s.h?'landscape':'portrait';
    if(!doc)doc=new jsPDF({orientation:o,unit:'in',format:[s.w,s.h]});else doc.addPage([s.w,s.h],o);
    for(const it of s.items){
      if(it.t==='line'){doc.setLineWidth(it.w/72);doc.setDrawColor(it.color||INK);doc.setLineDashPattern(it.dash||[],0);doc.line(it.x1,it.y1,it.x2,it.y2);}
      else if(it.t==='poly'){if(!it.fill&&!it.stroke)continue;doc.setLineDashPattern(it.dash||[],0);if(it.stroke){doc.setDrawColor(it.stroke);doc.setLineWidth((it.w||0.5)/72);}if(it.fill)doc.setFillColor(it.fill);
        for(const r of [it.pts,...(it.holes||[])]){doc.moveTo(r[0][0],r[0][1]);for(let j=1;j<r.length;j++)doc.lineTo(r[j][0],r[j][1]);if(it.close!==false)doc.close();}
        if(it.fill&&it.stroke)doc.fillStrokeEvenOdd();else if(it.fill)doc.fillEvenOdd();else doc.stroke();}
      else if(it.t==='circle'){doc.setLineDashPattern([],0);if(it.stroke){doc.setDrawColor(it.stroke);doc.setLineWidth((it.w||0.5)/72);}if(it.fill)doc.setFillColor(it.fill);doc.circle(it.cx,it.cy,it.r,it.fill&&it.stroke?'FD':it.fill?'F':'S');}
      else if(it.t==='text'){doc.setFont('helvetica',it.bold?'bold':'normal');doc.setFontSize(it.size);doc.setTextColor(it.color||INK);
        const w=doc.getTextWidth(it.s);const dx=it.anchor==='middle'?-w/2:it.anchor==='end'?-w:0;const a=(it.rot||0)*Math.PI/180;
        doc.text(it.s,it.x+dx*Math.cos(a),it.y+dx*Math.sin(a),it.rot?{angle:-it.rot}:undefined);}
    }}
  doc.setProperties({title:(p.name||'House')+' plans',creator:'Remodel Studio'});
  return doc.output('blob');
}

/* ---- DXF export (AutoCAD R12, inches, one file per level) ---- */
function dxfForLevel(p,lv){

  for(const w of walls){const L=wlen(w),d=wdir(w),n={x:-d.y,y:d.x},t=w.thick/2;const ja=J[w.id]?.a||0,jb=J[w.id]?.b||0;const layer=w.status==='existing'?'A-WALL-EXST':'A-WALL';
    const P=(s,o)=>[w.x1+d.x*s+n.x*o,w.y1+d.y*s+n.y*o];const ops=p.openings.filter(o=>o.wall===w.id).map(o=>{const pos=Math.max(o.width/2,Math.min(L-o.width/2,o.pos));return {o,s0:pos-o.width/2,s1:pos+o.width/2};}).sort((a,b)=>a.s0-b.s0);
    let c=-ja;const pieces=[];for(const q of ops){if(q.s0>c)pieces.push([c,q.s0]);c=Math.max(c,q.s1);}if(c<L+jb)pieces.push([c,L+jb]);

      if(o.type==='window'){line('A-GLAZ',...P(q.s0,0),...P(q.s1,0));line('A-GLAZ',...P(q.s0,t),...P(q.s1,t));line('A-GLAZ',...P(q.s0,-t),...P(q.s1,-t));}
      else{for(const g of doorGeom(o,t,q.s0,q.s1))for(let i=0;i+1<g.pts.length;i++)line('A-DOOR',...P(...g.pts[i]),...P(...g.pts[i+1]));}
      const mk=marks[o.id];if(mk){const tp=P((q.s0+q.s1)/2,(o.type==='door'?-(o.swing||1):1)*(t+10));text('A-ANNO-TAGS',tp[0],tp[1],4,mk,true);}}}
  for(const r of p.rooms.filter(r=>r.level===lv.id)){for(let i=0;i<r.pts.length;i++){const a=r.pts[i],b=r.pts[(i+1)%r.pts.length];line('A-AREA',a[0],a[1],b[0],b[1]);}
    const [cx,cy]=polyLabelPt(r.pts);text('A-AREA-IDEN',cx,cy,6,r.name.toUpperCase(),true);text('A-AREA-IDEN',cx,cy+9,4,Math.round(polyArea(r.pts)/144)+' SF',true);}
  for(const f of (p.fixtures||[]).filter(f=>f.level===lv.id&&f.status!=='demolish')){const c=fxCorners(f);for(let i=0;i<4;i++)line(f.type==='wallcab'?'A-FLOR-CASE-UPPR':'A-FLOR-FIXT',c[i].x,c[i].y,c[(i+1)%4].x,c[(i+1)%4].y);}
  for(const s of p.stairs.filter(s=>s.level===lv.id)){const si=stairInfo(p,s);const c=si.corners;for(let i=0;i<4;i++)line('A-FLOR-STRS',c[i].x,c[i].y,c[(i+1)%4].x,c[(i+1)%4].y);
    for(let i=1;i<=si.treads;i++)line('A-FLOR-STRS',c[0].x+si.d.x*s.tread*i,c[0].y+si.d.y*s.tread*i,c[1].x+si.d.x*s.tread*i,c[1].y+si.d.y*s.tread*i);}
  const layers=['A-WALL','A-WALL-EXST','A-GLAZ','A-DOOR','A-AREA','A-AREA-IDEN','A-ANNO-TAGS','A-FLOR-FIXT','A-FLOR-CASE-UPPR','A-FLOR-STRS'];const colors=[7,8,4,2,9,7,3,6,6,5];
  const tbl=`0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nLAYER\n70\n${layers.length}\n`+layers.map((l,i)=>`0\nLAYER\n2\n${l}\n70\n0\n62\n${colors[i]}\n6\n${l==='A-FLOR-CASE-UPPR'?'DASHED':'CONTINUOUS'}`).join('\n')+`\n0\nENDTAB\n0\nENDSEC`;
  return `0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1009\n9\n$INSUNITS\n70\n1\n0\nENDSEC\n${tbl}\n0\nSECTION\n2\nENTITIES\n${E.join('\n')}\n0\nENDSEC\n0\nEOF\n`;

function pasteParts(p,clip,levelId,n=1){
  if(!clip)return null;const off=24*n;const o={...JSON.parse(JSON.stringify(clip.obj)),id:uid(clip.kind.slice(0,2))};
  if(clip.kind==='opening'){const w=p.walls.find(w=>w.id===o.wall);if(!w)return null;const L=wlen(w);let pos=o.pos+(o.width+12)*n;if(pos+o.width/2>L)pos=o.pos-(o.width+12)*n;if(pos-o.width/2<0)return null;o.pos=pos;return {p:{...p,openings:[...p.openings,o]},sel:{kind:'opening',id:o.id}};}

function rotatePart(p,sel){const o=findObj(p,sel);if(!o)return null;

function MenuButton({label,items,id}){
  const [open,setOpen]=useState(false);const ref=useRef(null);
  useEffect(()=>{if(!open)return;const close=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};const kd=e=>{if(e.key==='Escape')setOpen(false);};
    document.addEventListener('pointerdown',close);window.addEventListener('keydown',kd);return ()=>{document.removeEventListener('pointerdown',close);window.removeEventListener('keydown',kd);};},[open]);
  return html`<div className="menu" ref=${ref}>
    <button id=${id} className=${'btn'+(open?' on':'')} aria-haspopup="menu" aria-expanded=${open} onClick=${()=>setOpen(!open)}>${label} <span aria-hidden="true">▾</span></button>
    ${open?html`<div className="menupop" role="menu">${items.map((it,i)=>it==='-'?html`<hr key=${i}/>`:html`<button key=${i} role="menuitem" disabled=${it.disabled} onClick=${()=>{setOpen(false);it.run();}}><span>${it.label}</span>${it.key?html`<kbd>${it.key}</kbd>`:null}</button>`)}</div>`:null}
  </div>`;
}

    <details className="frm"><summary>Trim in this room</summary><div className="grid1">
      ${TRIM_SLOTS.map(([slot,lab])=>html`<${Field} key=${slot} label=${lab} id=${'r-tr-'+slot}><${Sel} id=${'r-tr-'+slot} value=${t[slot]} onChange=${v=>up({trim:{...(o.trim||{}),[slot]:v}})} options=${opts(slot)}/><//>`)}
      ${o.trim?html`<button className="btn" onClick=${()=>up({trim:null})}>Use the whole-house trim</button>`:null}</div></details></div>`;
}
/* ---- door symbols on plan, by door type. Points are [distance along wall, offset from wall centerline]. ---- */
function doorGeom(o,t,s0,s1){
  const W=s1-s0,side=o.swing||1,out=[];const arc=(hs,dir,r,sd)=>{const pts=[];for(let k=0;k<=14;k++){const a=k/14*Math.PI/2;pts.push([hs+dir*r*Math.sin(a),sd*(t+r*Math.cos(a))]);}return pts;};
  switch(o.dtype||'swing'){
    case 'double':{const h=W/2;out.push({pts:[[s0,side*t],[s0,side*(t+h)]]},{pts:arc(s0,1,h,side),dash:true},{pts:[[s1,side*t],[s1,side*(t+h)]]},{pts:arc(s1,-1,h,side),dash:true});break;}
    case 'slider':{const L=W*0.55;out.push({pts:[[s0,t*0.35],[s0+L,t*0.35]],thick:true},{pts:[[s1-L,-t*0.35],[s1,-t*0.35]],thick:true});break;}
    case 'pocket':out.push({pts:[[s0,0],[s1,0]],thick:true},{pts:[[s0-W,0],[s0,0]],dash:true});break;
    case 'bifold':{const n=W>=48?4:2;const pts=[];for(let i=0;i<=n;i++)pts.push([s0+W*i/n,side*(t+(i%2?W/n*0.5:0))]);out.push({pts});break;}
    case 'barn':{const off=side*(t+1.5);out.push({pts:[[s0-2,off],[s1+2,off]],thick:true},{pts:[[s1+2,off],[s1+W+2,off]],dash:true});break;}
    case 'overhead':{const off=-side*(t+2);out.push({pts:[[s0,off],[s1,off]],dash:true},{pts:[[s0,off],[s0,off-side*Math.min(W,96)*0.4]],dash:true},{pts:[[s1,off],[s1,off-side*Math.min(W,96)*0.4]],dash:true});break;}
    default:{const hs=o.hinge?s1:s0,os=o.hinge?s0:s1;const dir=os>hs?1:-1;out.push({pts:[[hs,side*t],[hs,side*(t+W)]]},{pts:arc(hs,dir,W,side),dash:true});}
  }
  return out;
}

  const commitPreview=()=>{const q=previewRef.current;if(q)commit(q);};

  const doRedo=()=>{if(!redo.current.length)return;setProject(cur=>{undo.current.push(cur);return redo.current.pop();});tick(t=>t+1);};
  const load=q=>{undo.current.push(project);redo.current=[];setProject(q);setSel(null);setLevelId(q.levels[0].id);setFitPlan(x=>x+1);setFit3(x=>x+1);};

    if(!ok&&!fileHandle.current){say('This browser would not save the project (storage full or turned off). Use File, Download a copy.',false);return false;}
    setSavedProj(pp);say('Saved '+where+'.');return true;};

    if(where==='file'){if(canPickFiles()){try{const h=await pickSaveHandle(q);fileHandle.current=h;}catch(e){if(e&&e.name==='AbortError')return;}}
      else{fileHandle.current=null;const r=await saveFile(safeName(name)+'.json',JSON.stringify(q,null,1));if(!r.ok){say(r.t,false);return;}}}

      if(mod&&k==='v'){if(clip.current){e.preventDefault();doPaste();}return;}
      if(mod&&k==='d'){e.preventDefault();doDup();return;}
      if(!mod&&!e.altKey&&k==='e'&&sel){doRotate();return;}
      if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return;}
      if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();doRedo();return;}

      const tl=TOOLS.find(x=>x[2].toLowerCase()===k);if(tl){setTool(tl[0]);return;}

    };window.addEventListener('keydown',kd);return ()=>window.removeEventListener('keydown',kd);});

  const lv=lvlOf(project,levelId)||project.levels[0];
  const under=useUnderlayImages(shown,lv.id); const [ulMove,setUlMove]=useState(false);
  const ulChip=(shown.underlay&&shown.underlay.level===lv.id)||(shown.cloud&&shown.cloud.level===lv.id)?html`<button key="ul" className=${'chip'+(ulMove?' on':'')} onClick=${()=>setUlMove(!ulMove)} title="Drag the underlay or scan into place with the Select tool">Move underlay</button>`:null;
  const issueChip=html`<button key="ic" className=${'chip'+(showIssues?' on':'')} onClick=${()=>setShowIssues(!showIssues)} title="Show code-check markers on the plan">Issues ${showIssues?'shown':'hidden'}</button>`;
  const libBtn=html`<button key="lb" className="btn" onClick=${()=>{setPanel('library');setCollapsed(false);}}>More in the Library…</button>`;
  const fxPicker=html`<select id="fixture-type" className="inp" style=${{width:'auto',maxWidth:'260px'}} value=${fixtureType} onChange=${e=>setFixtureType(e.target.value)} aria-label="Fixture type">${LIB_BY_ID[fixtureType]?html`<option value=${fixtureType}>${LIB_BY_ID[fixtureType].label}</option>`:null}${['Bath','Kitchen','Laundry','Furniture'].map(c=>html`<optgroup key=${c} label=${c}>${Object.entries(FIXTURES).filter(([k,v])=>v.cat===c).map(([k,v])=>html`<option key=${k} value=${k}>${v.label}</option>`)}</optgroup>`)}</select>`;
  const openPick=k=>html`<select id=${k+'-preset'} className="inp" style=${{width:'auto',maxWidth:'260px'}} value=${openPreset[k]||''} onChange=${e=>setOpenPreset(s=>({...s,[k]:e.target.value||null}))} aria-label=${k+' type'}><option value="">${k==='door'?'Standard 36" door':'Standard 36" x 48" window'}</option>${[...new Set(LIB.filter(x=>x.place===k).map(x=>x.sub))].map(sb=>html`<optgroup key=${sb} label=${sb}>${LIB.filter(x=>x.place===k&&x.sub===sb).map(x=>html`<option key=${x.id} value=${x.id}>${x.label}</option>`)}</optgroup>`)}</select>`;
  const optbar=tool==='fixture'?html`${fxPicker}${libBtn}${issueChip}`:(tool==='door'||tool==='window')?html`${openPick(tool)}${libBtn}`:tool!=='wall'?html`${issueChip}${ulChip}`:html`
      <select id="wall-preset" className="inp" style=${{width:'auto'}} value=${wallPreset} onChange=${e=>setWallPreset(e.target.value)} aria-label="Wall type">${Object.entries(WALL_PRESETS).map(([k,v])=>html`<option key=${k} value=${k}>${v.label}</option>`)}</select>
      <button className=${'chip'+(ortho?' on':'')} onClick=${()=>setOrtho(!ortho)}>45° snap ${ortho?'on':'off'}</button>`;
  const planEl=html`<${PlanView} project=${shown} levelId=${lv.id} tool=${tool} setTool=${setTool} sel=${sel} setSel=${selShow} commit=${commit} setPreview=${setPreview} commitPreview=${commitPreview}
      ortho=${ortho} wallPreset=${wallPreset} layer=${layer} fixtureType=${fixtureType} openPreset=${openPreset} under=${under} ulMove=${ulMove&&tool==='select'} fitToken=${fitPlan} onDelete=${onDelete} optbar=${optbar} issues=${showIssues?issues:[]} onIssue=${goTo}/>`;
  const v3El=html`<div className="pane" style=${{display:'grid'}}><${View3D} project=${shown} levelId=${lv.id} sel=${sel} cutaway=${cutaway} showRoof=${showRoof} fitToken=${fit3} struct=${structMap} layer=${layer} sunInfo=${sunInfo} cloud=${under.cloudPts}/>${sun.on?html`<${SunPanel} p=${project} commit=${commit} sun=${sun} setSun=${setSun}/>`:null}
      <div className="corner"><button className=${'chip'+(showRoof?' on':'')} onClick=${()=>setShowRoof(!showRoof)}>Show roof</button><button className=${'chip'+(cutaway?' on':'')} onClick=${()=>setCutaway(!cutaway)} title="Hide levels above the one you are working on">Cut at level</button><button className=${'chip'+(sun.on?' on':'')} onClick=${()=>setSun(s=>({...s,on:!s.on,play:false}))} title="Sun and shadow study">Sun</button><button className="btn" onClick=${()=>setExportOpen(true)} title="AR view and Blender render kit">AR / Render</button><button className=${'chip'+(structView?' on':'')} onClick=${()=>setStructView(!structView)} title="Color members by how much of their capacity they use">Loads</button><button className="btn" onClick=${()=>setFit3(x=>x+1)}>Fit</button></div></div>`;
  return html`<div className="app">

        {label:'Duplicate',key:'Ctrl+D',run:doDup,disabled:!sel},{label:'Rotate 90° or flip',key:'E',run:doRotate,disabled:!sel},{label:'Delete',key:'Del',run:onDelete,disabled:!sel},'-',
        {label:'Select nothing',key:'Esc',run:()=>setSel(null),disabled:!sel},{label:'Rename project…',run:()=>setDlg('rename')}]}/>
      </div>

      <button className="btn undo-redo" onClick=${doUndo} disabled=${!undo.current.length} aria-label="Undo" title="Undo (Ctrl+Z)">${I.undo}</button>

      <div className=${'stage'+(mode==='split'?' split':'')}>${mode!=='3d'?planEl:null}${mode!=='plan'?v3El:null}</div>
      <${Inspector} libCtx=${{p:project,sel,commit,setTool,setFixtureType,setWallPreset,setOpenPreset,setMode,say}} p=${project} levelId=${lv.id} setLevelId=${setLevelId} sel=${sel} setSel=${selShow} commit=${commit} onDelete=${onDelete} collapsed=${collapsed} setCollapsed=${setCollapsed} onFile=${()=>setModal(true)} panel=${panel} setPanel=${setPanel} issues=${issues} goTo=${goTo} members=${members}/>
    </div>`}
    ${modal?html`<${FileModal} p=${project} onLoad=${load} onClose=${()=>setModal(false)}/>`:null}

    ${dlg==='rename'?html`<${RenameModal} p=${project} onDone=${n=>{commit({...project,name:n});setDlg(null);}} onClose=${()=>setDlg(null)}/>`:null}
    ${toast?html`<div className=${'toast'+(toast.ok?'':' err')} role="status">${toast.t}</div>`:null}
    ${exportOpen?html`<${ExportModal} p=${project} sun=${sun} onClose=${()=>setExportOpen(false)}/>`:null}
  </div>`;
