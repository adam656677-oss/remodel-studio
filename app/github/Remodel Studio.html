<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remodel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a drafting table. Header strip, tool rail at left, plan sheet and 3D model in the middle, spec panel at right.
   On phones the rail moves to the bottom and the spec panel becomes a sheet. */
:root{
  --chrome:#e9edf1;      /* app chrome */
  --panel:#f7f9fb;       /* side panels */
  --line:#cfd7df;        /* rules and borders */
  --ink:#16222e;         /* primary text */
  --ink-2:#56657a;       /* secondary text */
  --accent:#1d5fd1;      /* blueline: selection, active tool */
  --accent-soft:#dbe7fb;
  --paper:#fbfcfd;       /* plan sheet */
  --grid:#e6ebf1; --grid-major:#ccd6e2;
  --wall:#1d2a39; --wall-existing:#7d8a99; --ghost:#a7b4c3;
  --dim:#3d5675;
  --room-living:#efe6d6; --room-bedroom:#e3ebf3; --room-kitchen:#e7efe2; --room-bath:#dceff0; --room-hall:#eeeeee; --room-garage:#e4e1dc; --room-other:#ece8f2;
  --roof:#a2532c;
  --warn:#b26a00; --warn-soft:#fbefd9; --bad:#c23a32; --bad-soft:#fbe3e1; --good:#2f7d4f; --good-soft:#e1f2e7;
  --sky:#dfe7ee; --ground:#c9d1c1;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#0b1520; --panel:#101d2b; --line:#24364a; --ink:#e3ecf5; --ink-2:#95a7bb; --accent:#6ea6ff; --accent-soft:#1b3557;
  --paper:#0f2236; --grid:#163049; --grid-major:#21415f; --wall:#e4eef8; --wall-existing:#8aa0b6; --ghost:#3a5874; --dim:#a9c4e2;
  --room-living:#2a2a24; --room-bedroom:#1a2c40; --room-kitchen:#1d2e25; --room-bath:#173236; --room-hall:#22282e; --room-garage:#2a2824; --room-other:#26223a;
  --roof:#e08a5c; --warn:#f0b04a; --warn-soft:#3a2c10; --bad:#ff7b72; --bad-soft:#3b1a19; --good:#5fcf8b; --good-soft:#123323;
  --sky:#12202e; --ground:#2a3328; color-scheme:dark;}}
:root[data-theme="dark"]{
  --chrome:#0b1520; --panel:#101d2b; --line:#24364a; --ink:#e3ecf5; --ink-2:#95a7bb; --accent:#6ea6ff; --accent-soft:#1b3557;
  --paper:#0f2236; --grid:#163049; --grid-major:#21415f; --wall:#e4eef8; --wall-existing:#8aa0b6; --ghost:#3a5874; --dim:#a9c4e2;
  --room-living:#2a2a24; --room-bedroom:#1a2c40; --room-kitchen:#1d2e25; --room-bath:#173236; --room-hall:#22282e; --room-garage:#2a2824; --room-other:#26223a;
  --roof:#e08a5c; --warn:#f0b04a; --warn-soft:#3a2c10; --bad:#ff7b72; --bad-soft:#3b1a19; --good:#5fcf8b; --good-soft:#123323;
  --sky:#12202e; --ground:#2a3328; color-scheme:dark;}

html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--chrome);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--chrome);flex-wrap:wrap;min-width:0}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--accent)}
.projname{font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch;min-width:0}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select.inp{padding:5px 6px}
.lvlsel{max-width:150px}
@media (max-width:1500px){.projname{display:none}}

.main{display:grid;grid-template-columns:auto 1fr auto;min-height:0;min-width:0}
.rail{display:flex;flex-direction:column;gap:4px;padding:8px 6px;border-right:1px solid var(--line);background:var(--chrome);overflow-y:auto}
.tool{width:46px;height:46px;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink-2)}
.tool svg{width:22px;height:22px}
.tool small{font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tool:hover{border-color:var(--line);color:var(--ink)}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stage{position:relative;display:grid;min-width:0;min-height:0}
.stage.split{grid-template-columns:1fr 1fr}
.pane{position:relative;min-width:0;min-height:0;overflow:hidden}
.pane+.pane{border-left:1px solid var(--line)}
.plan{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--paper)}
.view3d{width:100%;height:100%;background:var(--sky)}
.view3d canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;left:10px;bottom:10px;right:10px;display:flex;gap:8px;align-items:flex-end;pointer-events:none;flex-wrap:wrap}
.hint{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12.5px;color:var(--ink-2);max-width:min(560px,100%)}
.hint b{color:var(--ink)}
.lenbuf{background:var(--accent);color:var(--paper);border-radius:7px;padding:6px 10px;font-family:var(--f-mono);font-size:14px}
.coords{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);background:color-mix(in srgb,var(--panel) 85%,transparent);border-radius:6px;padding:3px 7px}
.corner{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.corner .btn{background:color-mix(in srgb,var(--panel) 94%,transparent)}
.optbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 20px)}
.optbar .chip{background:color-mix(in srgb,var(--panel) 94%,transparent)}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;background:var(--panel);color:var(--ink-2)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.badge3d{position:absolute;left:10px;top:10px;font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.badgeplan{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:3px 4px}

.insp{width:300px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;min-height:0}
.insp-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.insp-h h2{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.insp-h .kind{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sec{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.field{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px}
.field label{font-size:12.5px;color:var(--ink-2)}
.inp{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:5px 8px;font-size:13px}
.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.stat span:first-child{color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:700}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:8px}
.lvl.on{border-color:var(--accent);background:var(--accent-soft)}
.lvl input[type=radio]{margin-top:7px;accent-color:var(--accent)}
.lvl .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lvl .grid2 label{font-size:11px;color:var(--ink-2);display:grid;gap:2px}
.note{font-size:12px;color:var(--ink-2);line-height:1.45;margin:0}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{accent-color:var(--accent);width:16px;height:16px}

.modal-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;display:grid;gap:12px;padding:18px}
.modal h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.modal textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px;font-family:var(--f-mono);font-size:12px;resize:vertical}
.msg{font-size:12.5px;color:var(--good)} .msg.err{color:var(--bad)}

/* checks */
.checkbtn .cnt{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;font-size:11px;font-weight:700}
.cnt.bad{background:var(--bad);color:var(--paper)} .cnt.warn{background:var(--warn);color:var(--paper)} .cnt.ok{background:var(--good-soft);color:var(--good)}
.checkbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.issue{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;text-align:left;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px;cursor:pointer}
.issue:disabled{cursor:default}
.issue:not(:disabled):hover{border-color:var(--accent)}
.issue.sev-error{border-left:3px solid var(--bad)} .issue.sev-warn{border-left:3px solid var(--warn)}
.issue-t{display:grid;gap:3px;min-width:0;font-size:12.5px;line-height:1.4}
.issue-t span{color:var(--ink-2)} .issue-t small{font-size:11px;color:var(--ink-2);font-family:var(--f-mono)}
.rulerow{display:grid;grid-template-columns:1fr 92px auto;gap:6px;align-items:center;font-size:12px}
.rulerow div{display:grid;min-width:0} .rulerow b{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);font-weight:500} .rulerow.changed b{color:var(--warn)}
.iss{cursor:pointer} .iss circle{stroke:var(--paper);stroke-width:2} .iss-error circle{fill:var(--bad)} .iss-warn circle{fill:var(--warn)} .iss text{fill:var(--paper);font:700 12px var(--f-body)}
/* structure and materials */
.member{display:grid;gap:4px;text-align:left}
.mrow{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar span{display:block;height:100%}
.bar .ok{background:var(--good)}.bar .warn{background:var(--warn)}.bar .bad{background:var(--bad)}
.memberbtn{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px;cursor:pointer;width:100%;color:inherit}
.memberbtn:hover{border-color:var(--accent)}
details summary{cursor:pointer}
.framing{border-top:1px dashed var(--line);padding-top:6px}.framing summary{font-size:12px;color:var(--ink-2);font-weight:600}
.framing .grid2{margin-top:6px}
.legend{position:absolute;left:10px;top:30px;display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px;color:var(--ink-2);background:color-mix(in srgb,var(--panel) 90%,transparent);border-radius:6px;padding:4px 8px;max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.matview{overflow:auto;min-height:0}
.matinner{grid-template-columns:minmax(0,1fr);max-width:1100px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.mathead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.mathead h2{margin:0;font-family:var(--f-display);font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.mathead p{max-width:60ch}
.mattotal{display:flex;gap:18px;flex-wrap:wrap;font-weight:600;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.mattotal span:last-child{margin-left:auto}
.matcat h3{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table.mat{border-collapse:collapse;width:100%;font-size:13px;min-width:640px;table-layout:fixed}
table.mat td{overflow-wrap:anywhere}
table.mat th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:7px 10px;border-bottom:1px solid var(--line)}
table.mat td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.mat tr:last-child td{border-bottom:0}
table.mat .num{text-align:right}
.priceinp{width:84px;text-align:right}
.importbox{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.importbox textarea{width:100%}
.fx{fill:var(--paper);stroke:var(--wall);stroke-width:1}
.fx-dash{stroke-dasharray:4 3}
.fx-sel{stroke:var(--accent);stroke-width:2}
.fx-demo{stroke:var(--bad);stroke-dasharray:4 3}
.fx-ghost{opacity:.55;pointer-events:none}
.fx-t{fill:var(--ink-2);font:600 10px var(--f-mono)}
.optcard{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px;background:var(--paper)}.optcard.on{border-color:var(--accent);background:var(--accent-soft)}
.optname{display:flex;gap:6px;align-items:center}.optname input{flex:1;min-width:0}.optname b{flex:1}
.optstats{display:flex;gap:12px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}.optstats .bad{color:var(--bad)}
.sunpanel{position:absolute;left:10px;bottom:48px;width:min(380px,calc(100% - 20px));background:color-mix(in srgb,var(--panel) 95%,transparent);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;font-size:13px}
.sunpanel input[type=range]{width:100%;accent-color:var(--accent)}
.sungrid{margin-top:6px}.sungrid label{font-size:11px;color:var(--ink-2);display:grid;gap:2px}
.sunquick .chip{padding:2px 8px}
.capcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;display:grid;gap:10px}
.capcard h3{margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.capcard h4{margin:8px 0 0;font-size:12.5px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{height:90px;border-radius:6px;border:1px solid var(--line);object-fit:cover}
.thumbfig{margin:0;display:grid;gap:2px;max-width:130px}
.capresult{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}.capresult p{margin:0}
.qform{display:grid;gap:6px}.qform .field{grid-template-columns:minmax(0,1fr) 140px}
.capgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.capgrid label{display:grid;gap:3px;font-size:12px;color:var(--ink-2)}
.oprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;align-items:end;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)}.oprow label{display:grid;gap:2px;font-size:11.5px;color:var(--ink-2)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.gallery figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.gallery img{width:100%;height:150px;object-fit:cover;display:block}.gallery figcaption{padding:8px;display:grid;gap:6px}
.calwrap{position:relative;display:inline-block;max-width:100%;cursor:crosshair}.calwrap img{max-width:100%;max-height:420px;display:block;border-radius:6px}
.calpt{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--paper);font:700 11px var(--f-body);display:grid;place-items:center;pointer-events:none}
/* sheets */
.sheets{display:grid;grid-template-columns:220px 1fr 300px;min-height:0}
.sheetlist{display:flex;flex-direction:column;gap:4px;padding:10px;border-right:1px solid var(--line);overflow-y:auto}
.sheetbtn{display:grid;grid-template-columns:44px 1fr;gap:6px;text-align:left;border:1px solid transparent;border-radius:8px;background:none;padding:8px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.sheetbtn:hover{border-color:var(--line);color:var(--ink)}
.sheetbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sheetpick{display:none}
.sheetview{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.sheetbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.sheetscroll{overflow:auto;padding:16px;min-height:0;background:var(--chrome)}
.paper{background:#ffffff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.12);margin:0 auto;max-width:none}
.paper svg{display:block}
.sheetpanel .sec .btn{justify-self:start}
/* plan sheet drawing */
.g-minor{stroke:var(--grid);stroke-width:1}
.g-major{stroke:var(--grid-major);stroke-width:1}
.w-new{fill:var(--wall)} .w-existing{fill:var(--wall-existing)} .w-demolish{fill:none;stroke:var(--bad);stroke-width:1.2;stroke-dasharray:5 3}
.w-sel{fill:var(--accent)} .w-demolish.w-sel{stroke:var(--accent);fill:var(--accent-soft)}
.w-ghost{fill:none;stroke:var(--ghost);stroke-width:1;stroke-dasharray:4 3}
.cut{fill:var(--paper)}
.op{stroke:var(--wall);stroke-width:1.2;fill:none}
.op-sel{stroke:var(--accent);stroke-width:2}
.op-glass{stroke:var(--wall);stroke-width:.8}
.dimt{fill:var(--dim);font-family:var(--f-mono);font-size:11px}
.dimt-sel{fill:var(--accent);font-weight:600}
.room{opacity:.95}
.room.room-sel{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 3}
.room{stroke-width:1}
.r-living{fill:var(--room-living);stroke:var(--room-living)} .r-bedroom{fill:var(--room-bedroom);stroke:var(--room-bedroom)} .r-kitchen{fill:var(--room-kitchen);stroke:var(--room-kitchen)} .r-bath{fill:var(--room-bath);stroke:var(--room-bath)} .r-hall{fill:var(--room-hall);stroke:var(--room-hall)} .r-garage{fill:var(--room-garage);stroke:var(--room-garage)} .r-other,.r-dining,.r-laundry,.r-closet{fill:var(--room-other);stroke:var(--room-other)}
.rname{fill:var(--ink);font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}

// All model lengths are stored in inches.
function fmtLen(inches){

}
function fmtFt(inches){ return (inches/12).toFixed(1)+' ft'; }
// Accepts 12'6", 12' 6 1/2", 12-6, 150", 6 ft 3 in, 6′ 3″ (Apple Measure), 1.9 m, 45 cm, 120 mm.
// A bare number uses `bare` units ('in' or 'ft').
function parseLen(str,bare='in'){

  let s=String(str).trim().toLowerCase()
    .replace(/[′’‘`]/g,"'").replace(/[″“”]/g,'"').replace(/''/g,'"')
    .replace(/\b(feet|foot|ft)\b\.?/g,"'").replace(/\b(inches|inch|in)\b\.?/g,'"')

function wallJoins(walls){

    }
    if(typeof addFixtures3D==='function')addFixtures3D(p,lv,add,std,sel,mSel);

// Baseboard and crown along each room edge, set in from the wall face and broken at door openings.
function addTrim3D(p,lv,walls,add,std){
  const tc=p.settings?.trimColor?hexNum(p.settings.trimColor):0xf7f6f1;const mT=std('trim-'+tc,tc,{roughness:.55});
  for(const r of p.rooms.filter(r=>r.level===lv.id)){const t=trimOf(p,r);const base=LIB_BY_ID[t.base],crown=LIB_BY_ID[t.crown],chair=LIB_BY_ID[t.chair],wain=LIB_BY_ID[t.wainscot];
    for(let i=0;i<r.pts.length;i++){const a={x:r.pts[i][0],y:r.pts[i][1]},b={x:r.pts[(i+1)%r.pts.length][0],y:r.pts[(i+1)%r.pts.length][1]};const L=dist(a,b);if(L<6)continue;const d={x:(b.x-a.x)/L,y:(b.y-a.y)/L};
      let n={x:-d.y,y:d.x};const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};if(!inPoly(mid.x+n.x*6,mid.y+n.y*6,r.pts))n={x:-n.x,y:-n.y};
      const w=walls.find(w=>{const q=projSeg(mid,{x:w.x1,y:w.y1},{x:w.x2,y:w.y2});const dw=wdir(w);return q.d<w.thick/2+1&&Math.abs(dw.x*d.x+dw.y*d.y)>0.99;});if(!w)continue;
      const inset=Math.max(0,w.thick/2-projSeg(mid,{x:w.x1,y:w.y1},{x:w.x2,y:w.y2}).d);
      const gaps=p.openings.filter(o=>o.wall===w.id&&o.type==='door').map(o=>{const c=openingCenter(p,o);const s=(c.x-a.x)*d.x+(c.y-a.y)*d.y;return [s-o.width/2-2.5,s+o.width/2+2.5];});
      const runs=[];let c=0;for(const [g0,g1] of gaps.sort((x,y)=>x[0]-y[0])){if(g0>c)runs.push([c,Math.min(g0,L)]);c=Math.max(c,g1);}if(c<L)runs.push([c,L]);
      const ry=-Math.atan2(d.y,d.x);const H=lv.height;
      const strip=(s0,s1,z0,h,th)=>{const m=(s0+s1)/2;const off=inset+th/2;add(new THREE.BoxGeometry((s1-s0)*IN,h*IN,th*IN),mT,(a.x+d.x*m+n.x*off)*IN,(lv.elevation+z0+h/2)*IN,(a.y+d.y*m+n.y*off)*IN,ry,false);};
      for(const [s0,s1] of runs){if(s1-s0<1)continue;
        if(base&&base.h>0)strip(s0,s1,0.75,base.h,Math.max(0.5,base.t));
        if(wain&&wain.h>0)strip(s0,s1,0.75+(base?base.h:0),wain.h-(base?base.h:0),0.4);
        if(chair&&chair.h>0)strip(s0,s1,chair.label.includes('84')?84:wain&&wain.h>0?wain.h:34,chair.h,chair.t);}
      if(crown&&crown.h>0)strip(0,L,H-crown.h*0.75,crown.h*0.75,crown.h*0.55);}
  }
}
/* ======================= inputs ======================= */
function LenInput({id,value,onChange,bare='in',placeholder}){
  const [text,setText]=useState(value==null?'':fmtLen(value)); const [bad,setBad]=useState(false);
  useEffect(()=>{setText(value==null?'':fmtLen(value));setBad(false);},[value]);
  const apply=()=>{ if(!text.trim()&&placeholder){onChange(null);return;} const v=parseLen(text,bare); if(v==null||v<0){setBad(true);return;} setBad(false); if(Math.abs(v-(value??-1))>1e-6) onChange(v); else setText(fmtLen(v)); };
  return html`<input id=${id} className=${'inp mono'+(bad?' bad':'')} value=${text} placeholder=${placeholder||''} inputMode="text" autoComplete="off"
    onChange=${e=>setText(e.target.value)} onBlur=${apply} onKeyDown=${e=>{if(e.key==='Enter')e.target.blur();if(e.key==='Escape'){setText(value==null?'':fmtLen(value));e.target.blur();}}} title="Examples: 12'6&quot;, 36&quot;, 6 ft 3 in, 1.9 m"/>`;
}
function NumInput({id,value,onChange,step=1,min,max}){
  const [text,setText]=useState(String(value)); useEffect(()=>setText(String(value)),[value]);
  const apply=()=>{const v=parseFloat(text);if(isNaN(v)){setText(String(value));return;}let c=v;if(min!=null)c=Math.max(min,c);if(max!=null)c=Math.min(max,c);if(c!==value)onChange(c);else setText(String(c));};
  return html`<input id=${id} className="inp mono" value=${text} inputMode="decimal" onChange=${e=>setText(e.target.value)} onBlur=${apply} onKeyDown=${e=>{if(e.key==='Enter')e.target.blur();}}/>`;
}
const Field=({label,id,children})=>html`<div className="field"><label htmlFor=${id}>${label}</label>${children}</div>`;
const Sel=({id,value,onChange,options})=>html`<select id=${id} className="inp" value=${value} onChange=${e=>onChange(e.target.value)}>${options.map(([v,l])=>html`<option key=${v} value=${v}>${l}</option>`)}</select>`;

  } else if(o&&sel.kind==='stair'){

  } else if(o&&sel.kind==='roof'){
    kind='Roof'; title=o.style[0].toUpperCase()+o.style.slice(1)+' roof'; const lv=lvlOf(p,o.level); const b=roofBuild(o,lv.elevation+lv.height);

    body=html`<div className="sec"><h3>Project</h3>

      <${Field} label="Floor above ground" id="p-grade"><${LenInput} id="p-grade" value=${p.settings.gradeOffset||0} onChange=${v=>commit({...p,settings:{...p.settings,gradeOffset:v}})}/><//>
      <div className="stat"><span>Walls · openings · rooms</span><span className="mono">${p.walls.length} · ${p.openings.length} · ${p.rooms.length}</span></div>
      <div className="stat"><span>Floor area (rooms)</span><span className="mono">${Math.round(area)} sq ft</span></div>
      <div className="row"><button className="btn" onClick=${onFile}>Save, open or start new…</button></div>
    </div>
    ${p.settings.code==='ibc'?html`<${IbcSummary} p=${p}/>`:null}
    ${(()=>{const t=trimOf(p,null);const opts=slot=>LIB.filter(x=>x.place==='trim'&&x.slot===slot).map(x=>[x.id,x.label]);const ups=patch=>commit({...p,settings:{...p.settings,...patch}});
      return html`<div className="sec"><h3>Trim (whole house)</h3>

    ${(()=>{const q=ensureOptions(p);const fin=pp=>{const rows=takeoff(pp,{waste:(pp.settings?.waste??10)/100});const pr=pp.prices||{};let t=0,n=0;for(const r of rows){const v=pr[r.key.replace(/\|(new|demo)$/,'')];if(v!=null){t+=v*r.qty;n++;}}const iss=runChecks(pp);return {area:Math.round(pp.rooms.reduce((s,r)=>s+polyArea(r.pts),0)/144),cost:n?t:null,fails:iss.filter(i=>i.sev==='error').length};};
      return html`<div className="sec"><h3>Design options</h3><p className="note">Each option is a separate copy of the house. Switch with the option menu at the top; the active one is drawn, checked and printed.</p>
        ${q.options.map(o=>{const pp=optionProject(q,o);const f=fin(pp);const on=o.id===q.activeOption;return html`<div key=${o.id} className=${'optcard'+(on?' on':'')}>

          <div className="optstats mono"><span>${f.area} SF</span><span>${f.cost==null?'No prices':'$'+Math.round(f.cost).toLocaleString('en-US')}</span><span className=${f.fails?'bad':''}>${f.fails} fail${f.fails===1?'':'s'}</span></div></div>`;})}
        <div className="row"><button className="btn" onClick=${()=>commit(addOption(p))}>New option from this one</button></div></div>`;})()}
    <div className="sec"><h3>Levels</h3>
      ${[...lvls].reverse().map(l=>html`<div key=${l.id} className=${'lvl'+(l.id===lv.id?' on':'')}>

        <div style=${{display:'grid',gap:'6px',minWidth:0}}>

          <div className="grid2"><label>Floor elevation<${LenInput} id=${'lve-'+l.id} value=${l.elevation} bare="ft" onChange=${v=>updLv(l.id,{elevation:v})}/></label>

            return html`<details className="framing"><summary>Floor and ceiling framing</summary><div className="grid2">
              ${first?html`<label>Foundation<${Sel} id=${'fnd-'+l.id} value=${fr.foundation} onChange=${v=>upf({foundation:v})} options=${[['crawl','Crawlspace'],['slab','Slab on grade'],['basement','Basement']]}/></label>`:null}
              ${first&&fr.foundation==='slab'?null:html`<label>Floor joists<${Sel} id=${'fj-'+l.id} value=${fr.joist} onChange=${v=>upf({joist:v})} options=${Object.keys(LUMBER).map(k=>[k,k])}/></label>
              <label>Spacing<${Sel} id=${'fs-'+l.id} value=${String(fr.spacing)} onChange=${v=>upf({spacing:+v})} options=${[['12','12" o.c.'],['16','16" o.c.'],['19.2','19.2" o.c.'],['24','24" o.c.']]}/></label>
              <label>Joists run<${Sel} id=${'fd-'+l.id} value=${fr.dir} onChange=${v=>upf({dir:v})} options=${[['auto','Shortest way'],['x','Left to right'],['y','Top to bottom']]}/></label>`}

              <label>Lumber<${Sel} id=${'fsp-'+l.id} value=${fr.species} onChange=${v=>upf({species:v})} options=${Object.entries(SPECIES).map(([k,v])=>[k,v.label])}/></label>
              ${top?html`<label>Ceiling joists<${Sel} id=${'fc-'+l.id} value=${fr.ceiling} onChange=${v=>upf({ceiling:v})} options=${Object.keys(LUMBER).map(k=>[k,k])}/></label>
              <label className="check"><input type="checkbox" id=${'fa-'+l.id} checked=${!!fr.atticStorage} onChange=${e=>upf({atticStorage:e.target.checked})}/> Attic storage</label>`:null}
            </div></details>`;})()}
          ${p.levels.length>1?html`<div><button className="btn danger" onClick=${()=>delLevel(l.id)}>Delete level</button></div>`:null}
        </div></div>`)}
      <div className="row"><button className="btn" onClick=${addLevel}>Add level</button><button className="btn" onClick=${copyUp}>Copy exterior walls up</button>
        <button className="btn" onClick=${()=>{const r=roofOverLevel(p,lv.id);if(r){commit({...p,roofs:[...p.roofs,r]});setSel({kind:'roof',id:r.id});}}}>Roof this level</button></div>

    <div className="sec"><h3>Typing lengths</h3><p className="note">Any length box takes 12'6", 12-6, 150", 6 ft 3 in, metric like 1.9 m, or a value pasted from the iPhone Measure app. Wall and level boxes treat a bare number as feet; door, window and thickness boxes treat it as inches.</p></div>`;
  }
  return html`<aside className=${'insp'+(collapsed?' collapsed':'')}>
    <div className="insp-h"><div style=${{minWidth:0,flex:1}}>${kind?html`<div className="kind">${kind}</div>`:null}<h2>${title}</h2></div>
      ${o?html`<button className="btn danger" onClick=${onDelete} title="Delete (Del)">Delete</button><button className="btn" onClick=${()=>setSel(null)} aria-label="Close">✕</button>`:null}
      <button className="btn mobile-only" onClick=${()=>setCollapsed(!collapsed)} aria-label=${collapsed?'Show panel':'Hide panel'}>${collapsed?'▴':'▾'}</button>
    </div>${mineEl}${memberEl}${body}${o?html`<${PinnedPhotos} p=${p} sel=${sel}/>`:null}</aside>`;
}

// Each fixture is a box: center x,y; width w (side to side), depth d (back to front), height h, bottom elev.
// rot turns it on plan; the back is local -y, the front faces local +y.
const FIXTURES={
  toilet:{label:'Toilet',cat:'Bath',w:20,d:28,h:30,color:0xf4f4f2},

  base:{label:'Base cabinet',cat:'Kitchen',w:36,d:24,h:36,color:0xd8c3a1},
  sinkbase:{label:'Sink base cabinet',cat:'Kitchen',w:36,d:24,h:36,color:0xd8c3a1},
  wallcab:{label:'Wall cabinet',cat:'Kitchen',w:36,d:12,h:30,elev:54,color:0xd8c3a1},
  tall:{label:'Tall pantry cabinet',cat:'Kitchen',w:24,d:24,h:84,color:0xd8c3a1},
  range:{label:'Range',cat:'Kitchen',w:30,d:26,h:36,color:0x2f3236},
  fridge:{label:'Refrigerator',cat:'Kitchen',w:36,d:30,h:70,color:0xc9ccd0},
  dw:{label:'Dishwasher',cat:'Kitchen',w:24,d:24,h:34.5,color:0xc9ccd0},
  island:{label:'Island',cat:'Kitchen',w:72,d:36,h:36,color:0xd8c3a1},
  washer:{label:'Washer',cat:'Laundry',w:27,d:30,h:38,color:0xf0f0f0},
  dryer:{label:'Dryer',cat:'Laundry',w:27,d:30,h:38,color:0xf0f0f0},
  bed:{label:'Queen bed',cat:'Furniture',w:60,d:80,h:24,color:0xb7c4d4},
  sofa:{label:'Sofa',cat:'Furniture',w:84,d:36,h:32,color:0x8f9aa8},

};
const COUNTERTOP=new Set(['base','sinkbase','island','vanity']);
const KITCHEN_FRONT=new Set(['base','sinkbase','range','fridge','dw','island','tall']);
function fxLocal(f,lx,ly){const a=(f.rot||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return {x:f.x+lx*c-ly*s,y:f.y+lx*s+ly*c};}
function fxCorners(f){return [[-f.w/2,-f.d/2],[f.w/2,-f.d/2],[f.w/2,f.d/2],[-f.w/2,f.d/2]].map(([a,b])=>fxLocal(f,a,b));}

function FileModal({p,onLoad,onClose}){
  const [text,setText]=useState(()=>JSON.stringify(p,null,1)); const [msg,setMsg]=useState(null); const [confirmNew,setConfirmNew]=useState(false);
    const tryLoad=(t)=>{try{const q=JSON.parse(t);if(!validProject(q))throw new Error();onLoad(normalize(q));setMsg({ok:true,t:'Project loaded.'});}catch(e){setMsg({ok:false,t:'That text is not a Remodel Studio project. Paste the full JSON copied from this dialog.'});}};
  const copy=async(e)=>{try{await navigator.clipboard.writeText(text);setMsg({ok:true,t:'Copied. Paste it into a .json file or a note to keep it.'});}catch(_){const ta=e.target.closest('.modal').querySelector('textarea');ta.focus();ta.select();setMsg({ok:true,t:'Text selected. Press Ctrl+C (or Copy) to copy it.'});}};
  const download=async()=>setMsg(await saveFile(safeName(p.name)+'.json',JSON.stringify(p,null,1)));
  const onFile=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{setText(String(r.result));tryLoad(String(r.result));};r.readAsText(f);};
  return html`<div className="modal-bg" onPointerDown=${e=>{if(e.target===e.currentTarget)onClose();}}><div className="modal" role="dialog" aria-label="Save or open a project">
    <h2>Save or open</h2>
    <p className="note">Your work saves automatically in this browser. To keep a copy or move it to another computer, download it as a .json file, or copy the project text below and paste it back here later.</p>
    <textarea id="proj-json" value=${text} onChange=${e=>setText(e.target.value)} spellCheck=${false}></textarea>
    <div className="row">
      <button className="btn primary" onClick=${copy}>Copy project</button>
      <button className="btn" onClick=${download}>Download .json</button>
      <button className="btn" onClick=${()=>tryLoad(text)}>Open pasted text</button>
      <label className="btn" htmlFor="proj-file">Open .json file</label><input id="proj-file" type="file" accept=".json,application/json" hidden onChange=${onFile}/>
    </div>
    ${msg?html`<div className=${'msg'+(msg.ok?'':' err')}>${msg.t}</div>`:null}
    <div className="sec" style=${{padding:'12px 0 0',borderBottom:0,borderTop:'1px solid var(--line)'}}>
      ${confirmNew?html`<p className="note">Start over? The current project is replaced. Copy it first if you want to keep it.</p>
        <div className="row"><button className="btn danger" onClick=${()=>{onLoad(blankProject());onClose();}}>Start a blank project</button><button className="btn" onClick=${()=>{onLoad(sampleProject());onClose();}}>Load the sample house</button><button className="btn" onClick=${()=>setConfirmNew(false)}>Cancel</button></div>`
      :html`<div className="row"><button className="btn" onClick=${()=>setConfirmNew(true)}>New project…</button><span className="spacer"></span><button className="btn" onClick=${onClose}>Done</button></div>`}
    </div></div></div>`;
}

// Planning-level wood checks: simple-span bending, shear and deflection for joists, rafters, headers and beams.
// Design values are approximate NDS reference values for visual-graded lumber; verify against the current NDS Supplement.
const LUMBER={'2x4':3.5,'2x6':5.5,'2x8':7.25,'2x10':9.25,'2x12':11.25};
const SPECIES={
  syp2:{label:'Southern Pine #2',Fb:{'2x4':1100,'2x6':1000,'2x8':925,'2x10':800,'2x12':750},CF:{'2x4':1,'2x6':1,'2x8':1,'2x10':1,'2x12':1},Fv:175,E:1.4e6},
  spf2:{label:'Spruce-Pine-Fir #1/#2',Fb:875,CF:{'2x4':1.5,'2x6':1.3,'2x8':1.2,'2x10':1.1,'2x12':1.0},Fv:135,E:1.4e6},
  df2:{label:'Douglas Fir-Larch #2',Fb:900,CF:{'2x4':1.5,'2x6':1.3,'2x8':1.2,'2x10':1.1,'2x12':1.0},Fv:180,E:1.6e6},
};
const LVL={Fb:2600,Fv:285,E:2.0e6,ply:1.75};
// header and beam choices, smallest first
const BEAMS=[
  {id:'2-2x6',label:'(2) 2x6',plies:2,size:'2x6'},{id:'2-2x8',label:'(2) 2x8',plies:2,size:'2x8'},{id:'2-2x10',label:'(2) 2x10',plies:2,size:'2x10'},
  {id:'2-2x12',label:'(2) 2x12',plies:2,size:'2x12'},{id:'3-2x12',label:'(3) 2x12',plies:3,size:'2x12'},
  {id:'2-lvl9',label:'(2) 1¾" x 9¼" LVL',plies:2,lvl:9.25},{id:'2-lvl12',label:'(2) 1¾" x 11⅞" LVL',plies:2,lvl:11.875},
  {id:'2-lvl14',label:'(2) 1¾" x 14" LVL',plies:2,lvl:14},{id:'3-lvl14',label:'(3) 1¾" x 14" LVL',plies:3,lvl:14},{id:'3-lvl16',label:'(3) 1¾" x 16" LVL',plies:3,lvl:16},{id:'3-lvl18',label:'(3) 1¾" x 18" LVL',plies:3,lvl:18},{id:'4-lvl18',label:'(4) 1¾" x 18" LVL',plies:4,lvl:18},
];
const FLOOR_FINISH={carpet:{label:'Carpet',dl:0},lvp:{label:'Vinyl plank',dl:0},hardwood:{label:'Hardwood',dl:1},tile:{label:'Tile',dl:5},concrete:{label:'Sealed concrete',dl:0}};
const ROOF_COVER={asphalt:{label:'Asphalt shingles',dl:10},metal:{label:'Metal panels',dl:6},tile:{label:'Clay or concrete tile',dl:20}};
const LIVE={bedroom:30,attic:10,atticStorage:20,roof:20,floor:40};
// IBC Table 1607.1 floor live loads (psf) by room use for commercial and city buildings; offices add 15 psf for partitions as dead load.
const IBC_LIVE={office:50,assembly:100,classroom:40,retail:100,storage:125,shop:125,corridor:100,hall:100,kitchen:50,bath:50,living:100,dining:100,other:50,garage:40,closet:50,laundry:50,bedroom:40};
function liveFor(p,r){if(p.settings?.code==='ibc')return IBC_LIVE[r.use]??50;return r.use==='bedroom'?LIVE.bedroom:LIVE.floor;}
function framingOf(lv){return {joist:'2x10',spacing:16,species:'syp2',dir:'auto',ceiling:'2x6',ceilingSpacing:16,atticStorage:false,foundation:'crawl',girders:96,...(lv.framing||{})};}
function rafterOf(r){return {system:'rafters',rafter:'2x8',spacing:24,species:'syp2',cover:'asphalt',...(r.framing||{})};}
// member design: b,d in inches, species values
function memberProps(spec,size,plies=1){
  if(spec.lvl)return {b:LVL.ply*spec.plies,d:spec.lvl,Fb:LVL.Fb*Math.pow(12/spec.lvl,0.136),Fv:LVL.Fv,E:LVL.E};
  const sp=SPECIES[spec.species||'syp2']||SPECIES.syp2; const sz=spec.size||size; const fb=typeof sp.Fb==='number'?sp.Fb:sp.Fb[sz];
  return {b:1.5*(spec.plies||plies),d:LUMBER[sz],Fb:fb*(sp.CF[sz]||1),Fv:sp.Fv,E:sp.E};
}
// uniform load w (plf) on a simple span L (in). Returns ratios (1.0 = at limit).
function checkMember(m,L,wTot,wLive,{Cr=1,CD=1,liveLim=360,totLim=240}={}){
  const w=wTot/12, wl=wLive/12; // lb/in
  const S=m.b*m.d*m.d/6, I=m.b*m.d*m.d*m.d/12;
  const M=w*L*L/8, V=w*L/2;
  const fb=M/S, Fb=m.Fb*Cr*CD; const fv=1.5*V/(m.b*m.d), Fv=m.Fv*CD;
  const dL=5*wl*Math.pow(L,4)/(384*m.E*I), dT=5*w*Math.pow(L,4)/(384*m.E*I);
  const rB=fb/Fb, rV=fv/Fv, rDL=dL/(L/liveLim), rDT=dT/(L/totLim);
  const ratio=Math.max(rB,rV,rDL,rDT);
  const gov=ratio===rB?'bending':ratio===rV?'shear':'deflection';
  return {ratio,rB,rV,rDL,rDT,gov,dL,dT};
}
// distance along a ray to the nearest support wall it crosses
function rayToSupport(pt,dir,supports,maxD=1e5){
  let best=null;
  for(const w of supports){const a={x:w.x1,y:w.y1},b={x:w.x2,y:w.y2};const ex=b.x-a.x,ey=b.y-a.y;const den=dir.x*ey-dir.y*ex;if(Math.abs(den)<1e-9)continue;
    const t=((a.x-pt.x)*ey-(a.y-pt.y)*ex)/den, u=((a.x-pt.x)*dir.y-(a.y-pt.y)*dir.x)/den;
    if(t>0.5&&u>=-0.02&&u<=1.02&&t<maxD&&(best==null||t<best))best=t;}
  return best;
}
function spanAcross(pt,axis,supports){const d=axis==='x'?{x:1,y:0}:{x:0,y:1};const a=rayToSupport(pt,d,supports),b=rayToSupport(pt,{x:-d.x,y:-d.y},supports);return a!=null&&b!=null?a+b:null;}
function floorSupports(p,lv){
  const below=sortedLevels(p).filter(l=>l.elevation<lv.elevation).pop();
  const src=below||lv; return p.walls.filter(w=>w.level===src.id&&(w.status!=='demolish'?(w.bearing||w.kind==='exterior'):w.bearing));
}
const isTop=(p,lv)=>!levelAbove(p,lv);
function suggestSize(L,wT,wL,spacing,species,opts){for(const sz of ['2x6','2x8','2x10','2x12']){const m=memberProps({species,size:sz},sz);if(checkMember(m,L,wT,wL,opts).ratio<=1)return sz;}return null;}
function suggestBeam(L,wT,wL,species,opts){for(const b of BEAMS){const m=memberProps(b.lvl?b:{...b,species},b.size,b.plies);if(checkMember(m,L,wT,wL,opts).ratio<=1)return b;}return null;}

// line load (plf) delivered to a wall from floors and roofs above it
function wallLoad(p,w){
  const lv=lvlOf(p,w.level); if(!lv)return {total:0,live:0,parts:[]};
  const d=wdir(w),n={x:-d.y,y:d.x}; const mid={x:(w.x1+w.x2)/2,y:(w.y1+w.y2)/2};
  const parts=[];let total=0,live=0;
  const trib=(supports)=>{let t=0;for(const s of [1,-1]){const dd=rayToSupport({x:mid.x+n.x*s*(w.thick/2+0.6),y:mid.y+n.y*s*(w.thick/2+0.6)},{x:n.x*s,y:n.y*s},supports.filter(o=>o.id!==w.id),600);if(dd!=null)t+=dd/2;}return t/12;};// ft
  const levels=sortedLevels(p); const idx=levels.findIndex(l=>l.id===lv.id);
  for(let i=idx+1;i<levels.length;i++){const L2=levels[i];const sup=p.walls.filter(o=>o.level===levels[i-1].id&&(o.status!=='demolish'?(o.bearing||o.kind==='exterior'):o.bearing));
    const t=trib(sup.some(o=>o.id===w.id)?sup:[...sup,w]); if(t<=0)continue;
    const ll=LIVE.floor,dl=10; total+=t*(ll+dl); live+=t*ll; parts.push(`${L2.name} floor: ${t.toFixed(1)} ft x ${ll+dl} psf`);
    const wallAbove=L2.height/12*10; total+=wallAbove; parts.push(`${L2.name} walls: ${Math.round(wallAbove)} plf`);}
  // roof and ceiling at the top
  const top=levels[levels.length-1];
  const roofs=p.roofs.filter(r=>r.level===top.id);
  {
    for(const r of roofs){const rf=rafterOf(r);const axis=r.style==='hip'?(r.w>=r.h?'x':'y'):(r.ridge||'x');
      const along=axis==='x'?Math.abs(d.y)<0.2:Math.abs(d.x)<0.2; // wall parallel to the ridge = eave wall
      const inside=mid.x>=r.x-1&&mid.x<=r.x+r.w+1&&mid.y>=r.y-1&&mid.y<=r.y+r.h+1; if(!inside)continue;
      const Vl=axis==='x'?r.h:r.w; let t=0;
      if(w.kind==='exterior'&&(along||r.style==='hip'))t=(Vl/2)/12+r.overhang/12;
      if(t>0){const dl=ROOF_COVER[rf.cover]?.dl??10;const add=t*(LIVE.roof+dl);
        // walls on lower levels carry the roof through the walls above when they stack
        total+=add;live+=t*LIVE.roof;parts.push(`Roof: ${t.toFixed(1)} ft x ${LIVE.roof+dl} psf`);}}
    if(w.level===top.id){const fr=framingOf(top);const sup=p.walls.filter(o=>o.level===top.id&&(o.status!=='demolish'?(o.bearing||o.kind==='exterior'):o.bearing));
      const t=trib(sup.some(o=>o.id===w.id)?sup:[...sup,w]);if(t>0){const ll=fr.atticStorage?LIVE.atticStorage:LIVE.attic;total+=t*(ll+10);live+=t*ll;parts.push(`Ceiling: ${t.toFixed(1)} ft x ${ll+10} psf`);}}
  }
  return {total,live,parts};
}

function analyzeStructure(p){
  const M=[];const lvls=sortedLevels(p);
  for(const lv of lvls){const fr=framingOf(lv);const first=lv===lvls[0];
    const slab=first&&fr.foundation==='slab';
    const sup=floorSupports(p,lv);
    for(const r of p.rooms.filter(r=>r.level===lv.id)){
      const c=polyLabelPt(r.pts);const pt={x:c[0],y:c[1]};
      // floor joists
      if(!slab&&r.use!=='garage'){
        let axis=fr.dir, L=null;
        if(axis==='auto'){const sx=spanAcross(pt,'x',sup),sy=spanAcross(pt,'y',sup);if(sx!=null&&(sy==null||sx<=sy)){axis='x';L=sx;}else if(sy!=null){axis='y';L=sy;}}
        else L=spanAcross(pt,axis,sup);
        if(first&&fr.foundation==='crawl'&&fr.girders>0){if(axis==='auto')axis='x';L=L==null?fr.girders:Math.min(L,fr.girders);}
        if(L!=null){const dlF=10+(FLOOR_FINISH[r.finish]?.dl||0)+(p.settings?.code==='ibc'&&r.use==='office'?15:0); const ll=liveFor(p,r);
          const s=fr.spacing/12; const wT=(ll+dlF)*s, wL=ll*s; const m=memberProps({species:fr.species,size:fr.joist},fr.joist);
          const res=checkMember(m,L,wT,wL,{Cr:1.15,liveLim:360,totLim:240});
          M.push({kind:'floor',id:'fj-'+r.id,label:`${r.name} floor joists`,level:lv.id,target:{kind:'room',id:r.id},pt,size:fr.joist,spacing:fr.spacing,species:fr.species,span:L,axis,load:`${ll} live + ${dlF} dead psf`,...res,
            suggest:res.ratio>1?suggestSize(L,wT,wL,fr.spacing,fr.species,{Cr:1.15,liveLim:360,totLim:240}):null,code:'R502.3'});}}
      // ceiling joists on the top level
      const trussed=p.roofs.some(rf=>rf.level===lv.id&&rafterOf(rf).system==='trusses');
      if(isTop(p,lv)&&!trussed){const csup=p.walls.filter(o=>o.level===lv.id&&(o.status!=='demolish'?(o.bearing||o.kind==='exterior'):o.bearing));
        const sx=spanAcross(pt,'x',csup),sy=spanAcross(pt,'y',csup);let L=null,axis='x';if(sx!=null&&(sy==null||sx<=sy)){L=sx;}else if(sy!=null){L=sy;axis='y';}
        if(L!=null){const ll=fr.atticStorage?LIVE.atticStorage:LIVE.attic,dl=fr.atticStorage?10:5;const s=fr.ceilingSpacing/12;const m=memberProps({species:fr.species,size:fr.ceiling},fr.ceiling);
          const res=checkMember(m,L,(ll+dl)*s,ll*s,{Cr:1.15,liveLim:240,totLim:240});
          M.push({kind:'ceiling',id:'cj-'+r.id,label:`${r.name} ceiling joists`,level:lv.id,target:{kind:'room',id:r.id},pt,size:fr.ceiling,spacing:fr.ceilingSpacing,species:fr.species,span:L,axis,load:`${ll} live + ${dl} dead psf (attic)`,...res,
            suggest:res.ratio>1?suggestSize(L,(ll+dl)*s,ll*s,fr.ceilingSpacing,fr.species,{Cr:1.15,liveLim:240,totLim:240}):null,code:'R802.5'});}}
    }
    // headers in bearing and exterior walls

function parsePriceCSV(text){

    if(ada){const L=wlen(w);const pos=Math.max(o.width/2,Math.min(L-o.width/2,o.pos));const latchS=o.hinge?pos-o.width/2:pos+o.width/2;const dirSign=o.hinge?-1:1;

  const extDoors=p.openings.filter(o=>{if(o.type!=='door')return false;const w=p.walls.find(w=>w.id===o.wall);return w&&w.kind==='exterior'&&w.level===first?.id;});
  if(!ibc&&p.walls.length&&first){
    if(!extDoors.length)add('error','exitDoorW','No exterior door on the first floor','Every house needs at least one egress door to the outside.',null,null,first.id);

    if(si.riserH>rv(p,'riser')+1e-6)add('error','riser','Stair risers too tall',`${si.risers} risers at ${fmtLen(si.riserH)}; max ${fmtLen(rv(p,'riser'))}.`,T,pt,s.level);
    if(s.tread<rv(p,'tread')-1e-6)add('error','tread','Stair treads too shallow',`${fmtLen(s.tread)} treads; need ${fmtLen(rv(p,'tread'))}.`,T,pt,s.level);
    if(s.width<rv(p,'stairW')-1e-6)add('error','stairW','Stair too narrow',`${fmtLen(s.width)} wide; needs ${fmtLen(rv(p,'stairW'))}.`,T,pt,s.level);}

  for(const o of p.openings.filter(o=>o.type==='window')){const c=openingCenter(p,o);if(!c)continue;const lv=lvlOf(p,c.w.level);if(!lv||!first)continue;
    const drop=lv.elevation-first.elevation+grade;
    if(c.w.kind==='exterior'&&drop>72&&o.sill<rv(p,'guardSill')-0.01)add('warn','guardSill',`${marks[o.id]||'Window'}: low sill on an upper floor`,`Sill ${fmtLen(o.sill)} with a ${fmtLen(drop)} drop outside. Raise it to ${fmtLen(rv(p,'guardSill'))} or use a window-opening limiting device.`,{kind:'opening',id:o.id},c,c.w.level);}
  // ---- accessible entrance ----
  if(ada&&grade>0.5&&first){const runs=Math.ceil(grade/rv(p,'rampRise'));const len=grade*rv(p,'rampRun');

  fixtureChecks(p,add,ada);

    if(m.beam){add('warn',R,`New beam needed where bearing wall is removed`,(m.suggest==='Engineer to size'?`Span ${fmtLen(m.span)}, load about ${m.load}. No beam in the standard list carries this; an engineer should size it (often steel, or a shorter span with an added post).`:`Span ${fmtLen(m.span)}, load about ${m.load}. Suggested ${m.suggest}, with posts and footings at both ends. Have an engineer confirm before removing the wall.`),m.target,m.pt,m.level);continue;}
    if(m.ratio>1){const sp=m.spacing?` at ${m.spacing}" o.c.`:'';add('error',R,`${m.label} overstressed`,`${m.size}${sp} over ${fmtLen(m.span)} is at ${Math.round(m.ratio*100)}% of capacity (${govLabel[m.gov]}). ${m.suggest?`Use ${m.suggest}${m.kind==='header'?'':sp}`.replace(/\.?$/,'.'):'Shorten the span or add a beam.'}`,m.target,m.pt,m.level);}
    else if(m.ratio>0.95&&m.kind!=='header')add('warn',R,`${m.label} near limit`,`${m.size} over ${fmtLen(m.span)} is at ${Math.round(m.ratio*100)}% of capacity (${govLabel[m.gov]}).`,m.target,m.pt,m.level);}
  const rank={error:0,warn:1,info:2};I.sort((a,b)=>rank[a.sev]-rank[b.sev]);

}

/* ======================= 2021 IBC checks (commercial and city buildings) ======================= */
// Planning-level means-of-egress, occupant load and plumbing-fixture checks for buildings that fall under the IBC

// can be entered as rule overrides.
const IBC_RULES=[
  {id:'ibcCeiling',set:'IBC',code:'1208.2',title:'Ceiling height, occupiable spaces',unit:'in',value:90},
  {id:'ibcDoorClear',set:'IBC',code:'1010.1.1',title:'Egress door clear width',unit:'in',value:32},
  {id:'ibcDoorH',set:'IBC',code:'1010.1.1',title:'Egress door height',unit:'in',value:80},
  {id:'ibcCorridor',set:'IBC',code:'1020.3',title:'Corridor width, 50 or more occupants',unit:'in',value:44},
  {id:'ibcCorridorSmall',set:'IBC',code:'1020.3',title:'Corridor width, under 50 occupants',unit:'in',value:36},
  {id:'ibcRoomOneExit',set:'IBC',code:'1006.2.1',title:'Most occupants in a room with one exit door',unit:'people',value:49},
  {id:'ibcDoorWPer',set:'IBC',code:'1005.3.2',title:'Door egress width per occupant (no sprinklers)',unit:'in',value:0.2},
  {id:'ibcDoorWPerSpr',set:'IBC',code:'1005.3.2 Exc.',title:'Door egress width per occupant (sprinklered)',unit:'in',value:0.15},
  {id:'ibcStairWPer',set:'IBC',code:'1005.3.1',title:'Stair egress width per occupant (no sprinklers)',unit:'in',value:0.3},
  {id:'ibcRiser',set:'IBC',code:'1011.5.2',title:'Stair riser height, maximum',unit:'in',value:7},
  {id:'ibcTread',set:'IBC',code:'1011.5.2',title:'Stair tread depth, minimum',unit:'in',value:11},
  {id:'ibcStairW',set:'IBC',code:'1011.2',title:'Stair width, minimum',unit:'in',value:44},
  {id:'ibcSepRatio',set:'IBC',code:'1007.1.1',title:'Exit separation, fraction of the diagonal (no sprinklers)',unit:'ratio',value:0.5},
  {id:'ibcSepRatioSpr',set:'IBC',code:'1007.1.1 Exc. 2',title:'Exit separation, fraction of the diagonal (sprinklered)',unit:'ratio',value:0.333},

// Occupancy groups offered, with travel distance (Table 1017.2), single-exit limits (Table 1006.3.4(2)) and
// plumbing-fixture ratios (Table 2902.1). Fixture ratios are people per fixture; first/then split where the table does.
const OCCUPANCIES={
  B:{label:'B: Business (offices, city hall, clinics)',travel:200,travelSpr:300,oneExit:{load:49,travel:75},
    wc:[[50,25],[Infinity,50]],lav:[[80,40],[Infinity,80]],df:100,lf:150},
  'A-3':{label:'A-3: Assembly (meeting rooms, community center)',travel:200,travelSpr:250,oneExit:{load:49,travel:75},
    wcSplit:{m:125,f:65},lav:[[Infinity,200]],df:500,lf:15},
  M:{label:'M: Mercantile (stores)',travel:200,travelSpr:250,oneExit:{load:49,travel:75},
    wc:[[Infinity,500]],lav:[[Infinity,750]],df:1000,lf:60},
  E:{label:'E: Educational',travel:200,travelSpr:250,oneExit:{load:49,travel:75},
    wc:[[Infinity,50]],lav:[[Infinity,50]],df:100,lf:20},
  S:{label:'S-1: Storage or shop (public works garage)',travel:200,travelSpr:250,oneExit:{load:29,travel:100},
    wc:[[Infinity,100]],lav:[[Infinity,100]],df:1000,lf:300},

// Occupant load factors by room use, IBC Table 1004.5 (sq ft per person; net where the table says net).
const LOAD_FACTOR={office:[150,'gross','Business areas'],assembly:[15,'net','Assembly, tables and chairs'],seating:[7,'net','Assembly, chairs only'],
  classroom:[20,'net','Classroom'],retail:[60,'gross','Mercantile'],storage:[300,'gross','Storage, stock, shipping'],shop:[100,'gross','Industrial areas'],
  kitchen:[200,'gross','Kitchen, commercial'],living:[150,'gross','Business areas'],dining:[15,'net','Assembly, tables and chairs'],
  bedroom:[200,'gross','Residential'],garage:[200,'gross','Parking garage'],other:[150,'gross','Business areas']};
const NO_LOAD=new Set(['hall','corridor','bath','restroom','closet','laundry']);

function ibcSettings(p){const s=p.settings||{};return {on:s.code==='ibc',occ:OCCUPANCIES[s.occupancy]?s.occupancy:'B',spr:!!s.sprinklered};}
function fixtureNeed(table,load){if(!load)return 0;let need=0,left=load,prevCap=0;
  for(const [upTo,per] of table){const chunk=Math.min(left,upTo-prevCap);if(chunk<=0)break;need+=chunk/per;left-=chunk;prevCap=upTo;}
  return Math.max(1,Math.ceil(need-1e-9));}

  for(const r of p.rooms){const area=polyArea(r.pts)/144;const lf=NO_LOAD.has(r.use)?null:(LOAD_FACTOR[r.use]||[O.lf,'gross','Default for the occupancy']);
    rooms.push({r,area,lf,load:lf?Math.ceil(area/lf[0]-1e-9):0});}

  const wc=O.wcSplit?Math.ceil(total/2/O.wcSplit.m-1e-9)+Math.ceil(total/2/O.wcSplit.f-1e-9):fixtureNeed(O.wc,total);
  const lav=fixtureNeed(O.lav,total);
  const fx=(p.fixtures||[]).filter(f=>f.status!=='demolish');
  const have={wc:fx.filter(f=>f.type==='toilet').length,lav:fx.filter(f=>f.type==='lav'||f.type==='vanity').length};
  return {S,O,rooms,byLevel,total,exitsFor,need:{wc:total?wc:0,lav:total?lav:0,df:total?Math.max(1,Math.ceil(total/O.df-1e-9)):0,service:total?1:0},have,
    separate:total>15};
}
function ibcChecks(p,add){

    if(!['closet','storage','garage','bath','restroom'].includes(r.use)&&lv.height<rv(p,'ibcCeiling')-0.01)add('error','ibcCeiling',`${r.name}: ceiling too low`,`Ceiling ${fmtLen(lv.height)}; occupiable spaces need ${fmtLen(rv(p,'ibcCeiling'))}.`,T,pt,r.level);
    const doors=roomOpenings(p,r).filter(o=>o.type==='door');
    if(x.load>rv(p,'ibcRoomOneExit')&&doors.length<2)add('error','ibcRoomOneExit',`${r.name}: needs two exit doors`,`${x.load} occupants (${Math.round(x.area)} sq ft at ${x.lf[0]} ${x.lf[1]} per person). Rooms over ${rv(p,'ibcRoomOneExit')} need two doors, spaced apart.`,T,pt,r.level);

    if(clear<rv(p,'ibcDoorClear')-0.01)add('error','ibcDoorClear',`${mk}: egress door too narrow`,`About ${fmtLen(clear)} clear; needs ${fmtLen(rv(p,'ibcDoorClear'))}. Use a 36" door.`,{kind:'opening',id:o.id},c,c.w.level);
    if(o.height<rv(p,'ibcDoorH')-0.01)add('error','ibcDoorH',`${mk}: door too short`,`${fmtLen(o.height)} high; needs ${fmtLen(rv(p,'ibcDoorH'))}.`,{kind:'opening',id:o.id},c,c.w.level);}

  const ext=p.openings.filter(o=>{if(o.type!=='door')return false;const w=p.walls.find(w=>w.id===o.wall);return w&&w.kind==='exterior'&&w.status!=='demolish'&&w.level===first.id;});

    if(ext.length>=2&&needExits>=2){let best=0;for(let i=0;i<ext.length;i++)for(let j=i+1;j<ext.length;j++){const a=openingCenter(p,ext[i]),b=openingCenter(p,ext[j]);best=Math.max(best,Math.hypot(a.x-b.x,a.y-b.y));}
      const ratio=S.spr?rv(p,'ibcSepRatioSpr'):rv(p,'ibcSepRatio');
      if(best<ratio*diag-0.5)add('error',S.spr?'ibcSepRatioSpr':'ibcSepRatio','Exits are too close together',`The farthest-apart exits are ${fmtLen(best)} apart; they must be at least ${S.spr?'1/3':'1/2'} of the building diagonal (${fmtLen(ratio*diag)}).`,{kind:'opening',id:ext[0].id},openingCenter(p,ext[0]),first.id);}
    const per=S.spr?rv(p,'ibcDoorWPerSpr'):rv(p,'ibcDoorWPer');const needW=A.byLevel[0].load*per;const haveW=ext.reduce((s,o)=>s+Math.max(0,o.width-DOOR_STOP_LOSS),0);
    if(ext.length&&haveW<needW-0.01)add('error',S.spr?'ibcDoorWPerSpr':'ibcDoorWPer','Exit doors too narrow for the occupant load',`${A.byLevel[0].load} people x ${per}" = ${fmtLen(needW)} of door width needed; exterior doors give about ${fmtLen(haveW)} clear.`,null,null,first.id);
    if(worst>lim)add('error',R('1017.2','Exit access travel distance'),'Travel distance to an exit too long',`From the far corner of ${worstRoom?.name||'a room'} it is about ${Math.round(worst/12)} ft (walking along the walls); the limit is ${lim/12} ft${S.spr?' with sprinklers':' without sprinklers'}.`,worstRoom?{kind:'room',id:worstRoom.id}:null,null,first.id);
    else if(worst>lim*0.85)add('warn',R('1017.2','Exit access travel distance'),'Travel distance close to the limit',`About ${Math.round(worst/12)} ft of a ${lim/12} ft limit. Check the real walking path.`,worstRoom?{kind:'room',id:worstRoom.id}:null,null,first.id);

      if(st.length<need)add('error',R('1006.3.3','Number of exits per story'),`${l.lv.name}: needs ${need} exit stair${need>1?'s':''}`,`${l.load} occupants on this floor; found ${st.length} stair${st.length===1?'':'s'} reaching it.`,null,null,l.lv.id);
      const sw=l.load*rv(p,'ibcStairWPer');for(const s of st)if(s.width<Math.max(rv(p,'ibcStairW'),sw/Math.max(1,st.length))-0.01)add('error','ibcStairW','Exit stair too narrow',`${fmtLen(s.width)} wide; needs ${fmtLen(Math.max(rv(p,'ibcStairW'),sw/Math.max(1,st.length)))}.`,{kind:'stair',id:s.id},{x:s.x,y:s.y},s.level);}}
  for(const s of p.stairs){const si=stairInfo(p,s);const T={kind:'stair',id:s.id};const pt={x:s.x,y:s.y};
    if(si.riserH>rv(p,'ibcRiser')+1e-6)add('error','ibcRiser','Stair risers too tall',`${si.risers} risers at ${fmtLen(si.riserH)}; max ${fmtLen(rv(p,'ibcRiser'))}.`,T,pt,s.level);
    if(s.tread<rv(p,'ibcTread')-1e-6)add('error','ibcTread','Stair treads too shallow',`${fmtLen(s.tread)} treads; need ${fmtLen(rv(p,'ibcTread'))}.`,T,pt,s.level);}
  // plumbing fixtures
  if(A.total){const R29=R('2902.1','Minimum plumbing fixtures');
    if(A.have.wc<A.need.wc)add('error',R29,'Not enough toilets',`${A.total} occupants (${S.occ}) need ${A.need.wc} water closet${A.need.wc>1?'s':''}${A.separate?', split between men\'s and women\'s rooms':''}; ${A.have.wc} drawn.`,null,null,first.id);
    if(A.have.lav<A.need.lav)add('error',R29,'Not enough lavatories',`${A.total} occupants need ${A.need.lav} lavator${A.need.lav>1?'ies':'y'}; ${A.have.lav} drawn.`,null,null,first.id);

    if(A.separate&&A.have.wc<2)add('warn',R('2902.2','Separate facilities'),'Separate restrooms required',`Over 15 occupants: provide separate facilities for each sex, or single-user restrooms.`,null,null,first.id);}
  return A;
}
function IbcSummary({p}){
  const A=ibcAnalysis(p);const O=A.O;

    <div className="stat"><span>Occupancy</span><span>${A.S.occ}${A.S.spr?' · sprinklered':''}</span></div>
    ${A.byLevel.map(l=>html`<div key=${l.lv.id} className="stat"><span>${l.lv.name} occupant load</span><span className="mono">${l.load}</span></div>`)}
    <div className="stat"><span>Exits required, first floor</span><span className="mono">${A.byLevel[0]&&A.byLevel[0].load<=O.oneExit.load?'1 (if travel ≤ '+O.oneExit.travel+' ft)':A.exitsFor(Math.max(1,A.byLevel[0]?.load||0))}</span></div>
    <div className="stat"><span>Travel distance limit</span><span className="mono">${A.S.spr?O.travelSpr:O.travel} ft</span></div>
    <div className="stat"><span>Toilets · lavatories needed</span><span className="mono">${A.need.wc} · ${A.need.lav} (have ${A.have.wc} · ${A.have.lav})</span></div>
    <div className="stat"><span>Drinking fountains · service sink</span><span className="mono">${A.need.df} · ${A.need.service}</span></div>
    <p className="note">Occupant loads use IBC Table 1004.5 by room use. Rooms marked hall, corridor, bath or closet carry no separate load. Planning check only; the building official makes the final call.</p></div>`;
}
/* ======================= sun study, AR and render kit ======================= */
// Sun position from the NOAA low-precision formulas (good to well under a degree for planning).
function sunPosition(date,lat,lon){
  const R=Math.PI/180; const n=date.getTime()/86400000+2440587.5-2451545.0;
  const L=((280.460+0.9856474*n)%360+360)%360, g=((357.528+0.9856003*n)%360+360)%360;
  const lam=L+1.915*Math.sin(g*R)+0.020*Math.sin(2*g*R), eps=23.439-0.0000004*n;
  const ra=Math.atan2(Math.cos(eps*R)*Math.sin(lam*R),Math.cos(lam*R))/R, dec=Math.asin(Math.sin(eps*R)*Math.sin(lam*R))/R;
  const gmst=((18.697374558+24.06570982441908*n)%24+24)%24; let ha=gmst*15+lon-ra; ha=((ha+180)%360+360)%360-180;
  const alt=Math.asin(Math.sin(lat*R)*Math.sin(dec*R)+Math.cos(lat*R)*Math.cos(dec*R)*Math.cos(ha*R))/R;
  const az=Math.atan2(-Math.sin(ha*R),Math.tan(dec*R)*Math.cos(lat*R)-Math.sin(lat*R)*Math.cos(ha*R))/R;
  return {alt,az:(az+360)%360};
}
// US daylight saving: second Sunday in March to first Sunday in November
function usDST(y,m,d){const nth=(month,k)=>{const f=new Date(Date.UTC(y,month,1)).getUTCDay();return 1+((7-f)%7)+7*(k-1);};
  const s=nth(2,2),e=nth(10,1);const v=m*100+d;return v>=200+s&&v<1000+e;}
function siteOf(p){return {name:'Forest, MS',lat:32.364,lon:-89.474,tz:-6,dst:true,bearing:0,...(p.site||{})};}
function sunFor(site,dateStr,minutes){
  const [y,m,d]=dateStr.split('-').map(Number); const off=site.tz+(site.dst&&usDST(y,m-1,d)?1:0);
  const utc=new Date(Date.UTC(y,m-1,d,0,0,0)+(minutes-off*60)*60000); return {...sunPosition(utc,site.lat,site.lon),offset:off};
}
const COMPASS=['north','northeast','east','southeast','south','southwest','west','northwest'];

// direction toward the sun in plan coordinates (x right, y down); plan-up points at site.bearing
function sunPlanDir(az,bearing){const t=(az-bearing)*Math.PI/180;return {x:Math.sin(t),y:-Math.cos(t)};}

    <div className="row"><b>Sun study</b><span className="spacer"></span><span className="note mono">${pos.alt>0?`${Math.round(pos.alt)}° up, from the ${compassName(pos.az)} (${Math.round(pos.az)}°)`:'Sun is down'}</span></div>
    <div className="row"><input id="sun-date" type="date" className="inp" style=${{width:'auto'}} value=${sun.date} onChange=${e=>e.target.value&&setSun(s=>({...s,date:e.target.value}))}/>
      <span className="mono">${t12}</span><button className="btn" onClick=${()=>setSun(s=>({...s,play:!s.play}))}>${sun.play?'Pause':'Play day'}</button></div>
    <input id="sun-time" type="range" min="300" max="1260" step="5" value=${sun.min} onInput=${e=>setSun(s=>({...s,min:+e.target.value}))} aria-label="Time of day"/>
    <div className="row sunquick">${[['Mar 20','03-20'],['Jun 21','06-21'],['Sep 22','09-22'],['Dec 21','12-21']].map(([l,md])=>html`<button key=${md} className="chip" onClick=${()=>setSun(s=>({...s,date:s.date.slice(0,4)+'-'+md}))}>${l}</button>`)}</div>
    <details><summary className="note">Location and orientation</summary><div className="grid2 sungrid">
      <label>Place<input id="site-name" className="inp" value=${site.name} onChange=${e=>up({name:e.target.value})}/></label>
      <label>Top of plan faces<select id="site-bearing" className="inp" value=${String(site.bearing)} onChange=${e=>up({bearing:+e.target.value})}>${COMPASS.map((c,i)=>html`<option key=${c} value=${String(i*45)}>${c[0].toUpperCase()+c.slice(1)}</option>`)}</select></label>
      <label>Latitude<input id="site-lat" className="inp mono" value=${site.lat} inputMode="decimal" onChange=${e=>{const v=parseFloat(e.target.value);if(!isNaN(v)&&v>=-90&&v<=90)up({lat:v});}}/></label>

      <label className="check"><input id="site-dst" type="checkbox" checked=${site.dst} onChange=${e=>up({dst:e.target.checked})}/> US daylight saving</label></div>
      <p className="note">Set where the top of the plan points; elevations and the north arrow on the plan sheets follow it.</p></details>
  </div>`;
}

const loaded={};

async function loadExporters(){await loadScript('https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js');
  await loadScript('https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/exporters/GLTFExporter.js');await loadScript('https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/exporters/USDZExporter.js');}
// a clean, finished-looking copy of the model in meters (no selection, no demolished work)
function exportScene(p){
  const st={model:new THREE.Group()}; buildModel(st,p,sortedLevels(p).slice(-1)[0].id,null,{cutaway:false,showRoof:true,layer:'proposed'});
  const root=new THREE.Group(); root.name=(p.name||'House'); st.model.scale.setScalar(0.3048); root.add(st.model); root.updateMatrixWorld(true);
  // split multi-material meshes (walls with a different color on each face) into one mesh per material
  const multi=[];st.model.traverse(o=>{if(o.isMesh&&Array.isArray(o.material))multi.push(o);});
  for(const o of multi){const geo=o.geometry;const par=o.parent;for(const g of geo.groups){const sub=geo.clone();sub.setIndex(Array.from(geo.index.array.slice(g.start,g.start+g.count)));sub.clearGroups();
      const m=new THREE.Mesh(sub,o.material[g.materialIndex]);m.position.copy(o.position);m.rotation.copy(o.rotation);m.scale.copy(o.scale);par.add(m);}par.remove(o);}
  root.updateMatrixWorld(true);
  st.model.traverse(o=>{if(o.isMesh){o.material=o.material.clone();if(o.material.color)o.material.color.convertSRGBToLinear();if(o.material.transparent&&o.material.opacity<0.5&&o.material.color.r>0.8&&o.material.color.g<0.5)o.visible=false;}});
  return root;
}
const isIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function openAR(p){

  const blob=new Blob([arr],{type:'model/vnd.usdz+zip'});
  if(isIOS()&&!framedView){const a=document.createElement('a');a.rel='ar';a.href=URL.createObjectURL(blob);const img=document.createElement('img');a.appendChild(img);document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();},1000);return {ok:true,t:'Opening AR Quick Look…'};}

}
async function renderKit(p,sun){

  const box=new THREE.Box3().setFromObject(root); const c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
  const R=Math.max(s.x,s.z)*0.5; const B=v=>[+v.x.toFixed(3),+(-v.z).toFixed(3),+v.y.toFixed(3)];
  const site=siteOf(p); const pos=sunFor(site,sun.date,sun.min);
  const tgt=new THREE.Vector3(c.x,Math.min(c.y,1.6),c.z); const cams={}; const site0=siteOf(p);
  // corner views named by compass direction (plan up = site bearing)
  for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){const pb=Math.atan2(sx,-sz)*180/Math.PI;const name=compassName(site0.bearing+pb);
    const v=new THREE.Vector3(c.x+sx*(s.x/2+R*1.1),1.65,c.z+sz*(s.z/2+R*1.1));cams[name]={location:B(v),target:B(tgt),lens:28};}

  let sn={x:0,y:1};const ext=p.walls.filter(w=>w.kind==='exterior');const door=p.openings.find(o=>o.type==='door'&&ext.some(w=>w.id===o.wall));
  if(door){const w=p.walls.find(w=>w.id===door.wall);sn=outwardNormal(ext,w);}
  cams.street={location:B(new THREE.Vector3(c.x+sn.x*(s.x/2+R*1.4)-sn.y*s.x*0.15,1.65,c.z+sn.y*(s.z/2+R*1.4)+sn.x*s.z*0.15)),target:B(tgt),lens:32};
  cams.aerial={location:B(new THREE.Vector3(c.x-R*1.6,R*2.0,c.z+R*1.8)),target:B(c),lens:35};

  const d=sunPlanDir(pos.az,site.bearing); const el=Math.max(pos.alt,2)*Math.PI/180;
  const sunVec=[+(d.x*Math.cos(el)).toFixed(4),+(-d.y*Math.cos(el)).toFixed(4),+Math.sin(el).toFixed(4)];
  const scene={project:p.name,created:new Date().toISOString(),model:'model.glb',sun:{altitude:+pos.alt.toFixed(2),azimuth:+pos.az.toFixed(2),vector:sunVec,date:sun.date,minutes:sun.min,place:site.name},
    cameras:cams,default_camera:'street',resolution:[1920,1080],samples:128,output:'render.png'};
  const files={'model.glb':new Uint8Array(glb),'scene.json':fflate.strToU8(JSON.stringify(scene,null,2)),'render.py':fflate.strToU8(RENDER_PY),'README.txt':fflate.strToU8(RENDER_README)};
  const zip=fflate.zipSync(files,{level:6});
  return saveFile(safeName(p.name)+' render kit.zip',new Blob([zip],{type:'application/zip'}));
}

const RENDER_PY=`# Remodel Studio render script for Blender 4.2+ (Cycles).
# Usage: blender -b -P render.py -- scene.json [--camera NAME | --all] [--samples N] [--size WxH] [--open]
import bpy, json, math, os, sys
from mathutils import Vector

argv = sys.argv[sys.argv.index("--") + 1:] if "--" in sys.argv else []
if not argv:
    raise SystemExit("Give the scene.json path after --")
scene_path = os.path.abspath(argv[0])
base = os.path.dirname(scene_path)
cfg = json.load(open(scene_path))

def opt(name, default=None):
    if name in argv:
        i = argv.index(name)
        return argv[i + 1] if i + 1 < len(argv) and not argv[i + 1].startswith("--") else True
    return default

# fresh scene
bpy.ops.wm.read_factory_settings(use_empty=True)
scn = bpy.context.scene
bpy.ops.import_scene.gltf(filepath=os.path.join(base, cfg.get("model", "model.glb")))

# ground
bpy.ops.mesh.primitive_plane_add(size=400, location=(0, 0, -0.01))
ground = bpy.context.active_object
gmat = bpy.data.materials.new("Ground"); gmat.use_nodes = True
gb = gmat.node_tree.nodes.get("Principled BSDF")
gb.inputs["Base Color"].default_value = (0.20, 0.27, 0.13, 1)
gb.inputs["Roughness"].default_value = 0.95
ground.data.materials.append(gmat)

# soften glTF materials a little for a natural look
for m in bpy.data.materials:
    if not m.use_nodes or m.name == "Ground":
        continue
    b = m.node_tree.nodes.get("Principled BSDF")
    if b and "Roughness" in b.inputs and b.inputs["Roughness"].default_value < 0.3 and m.blend_method != "BLEND":
        b.inputs["Roughness"].default_value = 0.35

# sun and sky
sv = Vector(cfg["sun"]["vector"]).normalized()
bpy.ops.object.light_add(type="SUN", location=(0, 0, 50))
sun = bpy.context.active_object
sun.data.energy = 5.0 if cfg["sun"]["altitude"] > 5 else 1.0
sun.data.angle = math.radians(0.6)
sun.rotation_euler = (-sv).to_track_quat("-Z", "Y").to_euler()
world = bpy.data.worlds.new("Sky"); scn.world = world; world.use_nodes = True
nt = world.node_tree; bg = nt.nodes.get("Background")
try:
    sky = nt.nodes.new("ShaderNodeTexSky")
    for t in ("NISHITA", "MULTIPLE_SCATTERING", "SINGLE_SCATTERING", "HOSEK_WILKIE"):
        try:
            sky.sky_type = t; break
        except Exception:
            pass
    if hasattr(sky, "sun_elevation"):
        sky.sun_elevation = math.radians(max(cfg["sun"]["altitude"], 1))
        sky.sun_rotation = math.atan2(sv.x, sv.y)
    if hasattr(sky, "sun_disc"):
        sky.sun_disc = False
    nt.links.new(sky.outputs["Color"], bg.inputs["Color"])
    bg.inputs["Strength"].default_value = 0.2
except Exception as e:
    print("Sky texture not available, using a plain sky:", e)
    bg.inputs["Color"].default_value = (0.55, 0.68, 0.85, 1); bg.inputs["Strength"].default_value = 0.8

# render settings
scn.render.engine = "CYCLES"
scn.cycles.samples = int(opt("--samples", cfg.get("samples", 128)))
scn.cycles.use_denoising = True
w, h = cfg.get("resolution", [1920, 1080])
if opt("--size"):
    w, h = [int(v) for v in str(opt("--size")).lower().split("x")]
scn.render.resolution_x, scn.render.resolution_y = w, h
try:
    scn.view_settings.view_transform = "AgX"
    scn.view_settings.look = "AgX - Medium High Contrast"
except Exception:
    try:
        scn.view_settings.view_transform = "Filmic"
    except Exception:
        pass
prefs = bpy.context.preferences.addons["cycles"].preferences
device = "CPU"
for kind in ("OPTIX", "CUDA", "HIP", "METAL", "ONEAPI"):
    try:
        prefs.compute_device_type = kind
        prefs.get_devices()
        devs = [d for d in prefs.devices if d.type == kind]
        if devs:
            for d in prefs.devices:
                d.use = d.type == kind
            device = kind
            break
    except Exception:
        pass
scn.cycles.device = "GPU" if device != "CPU" else "CPU"
print("Rendering on", device)

def make_camera(name):
    c = cfg["cameras"][name]
    cam_data = bpy.data.cameras.new(name); cam_data.lens = c.get("lens", 28)
    cam = bpy.data.objects.new(name, cam_data); scn.collection.objects.link(cam)
    cam.location = Vector(c["location"])
    cam.rotation_euler = (Vector(c["target"]) - cam.location).to_track_quat("-Z", "Y").to_euler()
    return cam

names = list(cfg["cameras"].keys()) if opt("--all") else [opt("--camera", cfg.get("default_camera", "street"))]
for n in names:
    if n not in cfg["cameras"]:
        raise SystemExit("Unknown camera %s. Choose from: %s" % (n, ", ".join(cfg["cameras"])))
cams = [make_camera(n) for n in names]
scn.camera = cams[0]

if opt("--open"):
    print("Scene ready. Press F12 in Blender to render.")
else:
    for cam, n in zip(cams, names):
        scn.camera = cam
        out = os.path.join(base, cfg.get("output", "render.png") if len(names) == 1 else "render_%s.png" % n)
        scn.render.filepath = out
        bpy.ops.render.render(write_still=True)
        print("Saved", out)
`;

/* ======================= capture: photos, measurements, underlays, scans ======================= */
// Photos and scans are big, so they live in this browser's IndexedDB, keyed by project id; the project JSON keeps only references.
const DB_NAME='remodel-studio-assets';
function idb(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open(DB_NAME,1);}catch(e){rej(e);return;}r.onupgradeneeded=()=>{r.result.createObjectStore('assets',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function assetPut(a){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('assets','readwrite');t.objectStore('assets').put(a);t.oncomplete=()=>res(a);t.onerror=()=>rej(t.error);});}
async function assetDel(id){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('assets','readwrite');t.objectStore('assets').delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function assetList(project){const db=await idb();return new Promise((res,rej)=>{const out=[];const t=db.transaction('assets','readonly');const c=t.objectStore('assets').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){if(cur.value.project===project)out.push(cur.value);cur.continue();}else res(out);};c.onerror=()=>rej(c.error);});}
async function assetGet(id){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('assets','readonly');const r=t.objectStore('assets').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});}
// object URLs for blobs, created once
const urlCache=new Map();const blobURL=(id,blob)=>{if(!urlCache.has(id))urlCache.set(id,URL.createObjectURL(blob));return urlCache.get(id);};

async function downscale(file,maxPx=2000){
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,maxPx/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r({blob:b,w:c.width,h:c.height}),'image/jpeg',0.86));}
  catch(e){return {blob:file,w:0,h:0};}
}

/* ---- building geometry from measurements ---- */
const SIDE_ORDER=['back','right','behind','left']; // clockwise from the top of the plan
function freeSpot(p,levelId,W){const ws=p.walls.filter(w=>w.level===levelId);if(!ws.length)return {x:0,y:0};let x1=-1e9,y0=1e9;for(const w of ws){x1=Math.max(x1,w.x1,w.x2);y0=Math.min(y0,w.y1,w.y2);}return {x:Math.ceil((x1+72)/12)*12,y:Math.round(y0/12)*12};}
function buildRoom(p,levelId,spec){

  const corners=[{x:x0,y:y0},{x:x0+W,y:y0},{x:x0+W,y:y0+D},{x:x0,y:y0+D}];
  const walls=[],openings=[];

    // reuse an existing wall that already sits on this line
    const id=uid('w');walls.push({id,level:levelId,x1:a.x,y1:a.y,x2:b.x,y2:b.y,thick:pre.thick,kind:pre.kind,bearing:pre.bearing,height:spec.height||null,status:spec.status||'existing',side});
    const prevT=th(SIDE_ORDER[(i+3)%4]);
    for(const op of (spec.openings||[]).filter(q=>q.side===side)){const width=op.width||36;
      openings.push(op.type==='door'?{id:uid('op'),wall:id,type:'door',pos:(op.offset||0)+prevT/2+width/2,width,height:op.height||80,sill:0,hinge:0,swing:1,status:spec.status||'existing'}
        :{id:uid('op'),wall:id,type:'window',pos:(op.offset||0)+prevT/2+width/2,width,height:op.height||48,sill:op.sill??36,operation:op.operation||'double-hung',status:spec.status||'existing'});}});

// openings measured on the outside of a wall, offsets from the left end as you face the wall
